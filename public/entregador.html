<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Entregador</title>
</head>

<body>

    <h1>🛵 Painel do Entregador</h1>

    <h2 id="nomeEntregador">Carregando...</h2>

    <h3>📦 Pedidos de hoje</h3>

    <div id="resumoEntregador">
        <p>📊 Carregando resumo...</p>
    </div>

    <div id="listaPedidos">
        Carregando pedidos...
    </div>


<script>
async function carregarEntregador() {
    try {
        const resposta = await fetch("/api/entregador/me", {
            credentials: "include"
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso) {
            window.location.href = "/login-entregador.html";
            return;
        }

        document.getElementById("nomeEntregador").textContent =
            `Olá, ${dados.entregador.nome}!`;

    } catch (erro) {
        console.error("Erro ao carregar entregador:", erro);
        window.location.href = "/login-entregador.html";
    }
}

let pedidosEntregador = [];

async function carregarPedidos() {
    try {
        const resposta = await fetch(
            "/api/entregador/pedidos",
            {
                credentials: "include"
            }
        );

        const dados = await resposta.json();

        pedidosEntregador = dados.pedidos || [];

        const lista = document.getElementById("listaPedidos");

        if (!resposta.ok || !dados.sucesso) {
            lista.innerHTML = "<p>Erro ao carregar pedidos.</p>";
            return;
        }

        if (dados.pedidos.length === 0) {
            lista.innerHTML = "<p>Nenhum pedido para entrega hoje.</p>";
            return;
        }

        lista.innerHTML = dados.pedidos.map((pedido, indice) => `
            <div class="pedido-entregador">

                ${indice === 0 ? `
                    <p>
                        🚨 <strong>PRÓXIMA ENTREGA</strong>
                    </p>
                ` : ""}

                <h3>📦 Pedido #${pedido.id}</h3>

                <p>
                    👤 <strong>Cliente:</strong>
                    ${pedido.nome}
                </p>

                <p>
                    💰 <strong>Total:</strong>
                    R$ ${Number(pedido.total).toFixed(2)}
                </p>

                <p>
                    🛵 <strong>Taxa de entrega:</strong>
                    R$ ${Number(pedido.taxa_entrega || 0).toFixed(2)}
                </p>

                <p>
                    💳 <strong>Pagamento:</strong>
                    ${pedido.forma_pagamento}
                </p>

                ${
                    (() => {
                        let endereco = pedido.endereco;

                        try {
                            if (typeof endereco === "string") {
                                endereco = JSON.parse(endereco);
                            }
                        } catch (erro) {
                            endereco = null;
                        }

                        if (!endereco || typeof endereco !== "object") {
                            return `
                                <p>
                                    📍 <strong>Endereço:</strong>
                                    Não informado
                                </p>
                            `;
                        }

                        return `
                            <div class="endereco-pedido">
                                <h4>📍 Endereço de entrega</h4>

                                <p>
                                    <strong>Rua:</strong>
                                    ${endereco.rua || "-"}
                                </p>

                                <p>
                                    <strong>Número:</strong>
                                    ${endereco.numero || "-"}
                                </p>

                                <p>
                                    <strong>Bairro:</strong>
                                    ${endereco.bairro || "-"}
                                </p>

                                <p>
                                    <strong>Complemento:</strong>
                                    ${endereco.complemento || "-"}
                                </p>

                                <p>
                                    <strong>Ponto de referência:</strong>
                                    ${endereco.referencia || "-"}
                                </p>
                            </div>
                        `;
                    })()
                }

                <button onclick="abrirRota(${pedido.id})">
                    🗺️ Abrir rota
                </button>

                <button onclick="verPedido(${pedido.id})">
                    📋 Ver pedido
                </button>

                <button onclick="finalizarPedido(${pedido.id})">
                    ✅ Finalizar pedido
                </button>

            </div>
        `).join("");

    } catch (erro) {
        console.error("Erro ao carregar pedidos:", erro);

        document.getElementById("listaPedidos").innerHTML =
            "<p>Erro de conexão com o servidor.</p>";
    }
}


async function carregarResumo() {
    try {
        const resposta = await fetch(
            "/api/entregador/resumo",
            {
                credentials: "include"
            }
        );

        const dados = await resposta.json();

        const resumo = document.getElementById(
            "resumoEntregador"
        );

        if (!resposta.ok || !dados.sucesso) {
            resumo.innerHTML =
                "<p>Erro ao carregar resumo.</p>";
            return;
        }

        resumo.innerHTML = `
            <p>
                📦 <strong>Entregas realizadas:</strong>
                ${dados.resumo.entregasRealizadas}
            </p>

            <p>
                💰 <strong>Taxas de entrega:</strong>
                R$ ${dados.resumo.totalTaxas.toFixed(2)}
            </p>
        `;

    } catch (erro) {
        console.error(
            "Erro ao carregar resumo:",
            erro
        );

        document.getElementById(
            "resumoEntregador"
        ).innerHTML =
            "<p>Erro de conexão com o servidor.</p>";
    }
}


function abrirRota(pedidoId) {
    const pedido = pedidosEntregador.find(
        pedido => pedido.id === pedidoId
    );

    if (!pedido) {
        alert("Pedido não encontrado.");
        return;
    }

    let endereco = pedido.endereco;

    try {
        if (typeof endereco === "string") {
            endereco = JSON.parse(endereco);
        }
    } catch (erro) {
        endereco = null;
    }

    if (!endereco) {
        alert("Endereço de entrega não informado.");
        return;
    }

    const destino = [
        endereco.rua,
        endereco.numero,
        endereco.bairro,
        endereco.complemento
    ]
        .filter(Boolean)
        .join(", ");

    const url =
        `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}`;

    window.open(url, "_blank");
}


async function finalizarPedido(pedidoId) {
    const confirmar = confirm(
        "Confirmar que este pedido foi entregue?"
    );

    if (!confirmar) {
        return;
    }

    try {
        const resposta = await fetch(
            `/api/entregador/pedidos/${pedidoId}/finalizar`,
            {
                method: "PUT",
                credentials: "include"
            }
        );

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso) {
            alert(
                dados.erro ||
                "Não foi possível finalizar o pedido."
            );
            return;
        }

        alert("✅ Pedido finalizado!");

        await carregarPedidos();

        const proximoPedido = pedidosEntregador[0];

        if (proximoPedido) {
            const irParaProximo = confirm(
                `Próxima entrega: Pedido #${proximoPedido.id}\n\nDeseja abrir a rota agora?`
            );

            if (irParaProximo) {
                abrirRota(proximoPedido.id);
            }
        }

    } catch (erro) {
        console.error(
            "Erro ao finalizar pedido:",
            erro
        );

        alert("Erro de conexão com o servidor.");
    }
}

carregarResumo();
carregarEntregador();
carregarPedidos();

</script>


</body>
</html>
