<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Carrinho</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .card-item-carrinho {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            width: 220px;
        }

        .info-item-carrinho h3 {
            margin: 0 0 6px;
        }

        .info-item-carrinho p {
            margin: 4px 0;
        }

        .info-item-carrinho strong {
            display: block;
            margin-top: 8px;
            font-size: 18px;
        }

        .quantidade-carrinho {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantidade-carrinho button {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
        }

        .quantidade-carrinho span {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
        }

        .card-item-carrinho {
            position: relative;
        }

        .botao-lixeira {
            position: absolute;
            top: 12px;
            right: 12px;
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>🛒 Meu carrinho</h1>

    <div id="itensCarrinho"></div>

    <h2>
        Total: R$ <span id="totalCarrinho">0,00</span>
    </h2>

    <button onclick="voltarCardapio()">
        🛍️ Continuar comprando
    </button>

    <button onclick="finalizarPedido()">
        ✅ Finalizar pedido
    </button>

    <script>

        let carrinho = [];

        const carrinhoSalvo = localStorage.getItem("carrinho");

        if (carrinhoSalvo) {
            carrinho = JSON.parse(carrinhoSalvo);
        }

        function carregarCarrinho() {

            const container =
                document.getElementById("itensCarrinho");

            let total = 0;

            if (carrinho.length === 0) {

                container.innerHTML = `
                    <p>Seu carrinho está vazio.</p>
                `;

                document.getElementById("totalCarrinho").textContent = "0,00";

                return;
            }

            container.innerHTML = carrinho.map(item => {

                total += Number(item.subtotal);

                let descricao = "";

                if (item.tipo === "porcao") {

                    descricao = item.gramas === 1000
                        ? "1 kg"
                        : `${item.gramas} g`;

                } else if (item.tamanho) {

                    descricao = item.tamanho;
                }

                return `
                    <div class="card-item-carrinho">

                        <div class="info-item-carrinho">

                            <h3>${item.nome}</h3>

                            ${descricao
                                ? `<p>${descricao}</p>`
                                : ""
                            }

                            <strong>
                                R$ ${Number(item.subtotal)
                                    .toFixed(2)
                                    .replace(".", ",")}
                            </strong>

                        </div>

                        <div class="quantidade-carrinho">

                            <button onclick="alterarQuantidadeCarrinho(${item.id}, '${item.tamanho || ""}', ${item.gramas || 0}, -1)">
                                −
                            </button>

                            <span>${item.tipo === "porcao"
                                ? (item.gramas === 1000 ? "1 kg" : item.gramas + " g")
                                : item.quantidade
                            }</span>

                            <button onclick="alterarQuantidadeCarrinho(${item.id}, '${item.tamanho || ""}', ${item.gramas || 0}, 1)">
                                +
                            </button>

                        </div>

                        <button
                            class="botao-lixeira"
                            onclick="removerDoCarrinho(
                                ${item.id},
                                '${item.tamanho || ""}',
                                ${item.gramas || 0}
                            )">
                            🗑️
                        </button>

                    </div>
                `;

            }).join("");

            document.getElementById("totalCarrinho").textContent =
                total.toFixed(2).replace(".", ",");
        }


        function alterarQuantidadeCarrinho(id, tamanho, gramas, alteracao) {

            const item = carrinho.find((produto) =>
                produto.id === id &&
                (produto.tamanho || "") === tamanho &&
                (produto.gramas || 0) === gramas
            );

            if (!item) {
                return;
            }

            if (item.tipo === "porcao") {

                item.gramas += alteracao * 100;

                if (item.gramas < 100) {
                    item.gramas = 100;
                }

                if (item.gramas > 1000) {
                    item.gramas = 1000;
                }

                item.subtotal =
                    item.preco_kg * (item.gramas / 1000);

            } else {

                item.quantidade += alteracao;

                if (item.quantidade < 1) {
                    item.quantidade = 1;
                }

                item.subtotal =
                    item.preco * item.quantidade;
            }

            localStorage.setItem(
                "carrinho",
                JSON.stringify(carrinho)
            );

            carregarCarrinho();
        }


        function removerDoCarrinho(id, tamanho, gramas) {

            carrinho = carrinho.filter((item) =>
                !(
                    item.id === id &&
                    (item.tamanho || "") === tamanho &&
                    (item.gramas || 0) === gramas
                )
            );

            localStorage.setItem(
                "carrinho",
                JSON.stringify(carrinho)
            );

            carregarCarrinho();
        }


        function voltarCardapio() {

            const parametros =
                new URLSearchParams(window.location.search);

            const restauranteId =
                parametros.get("restaurante");

            window.location.href =
                `/cardapio.html?restaurante=${restauranteId}`;
        }

        function finalizarPedido() {

            if (carrinho.length === 0) {
                alert("Seu carrinho está vazio.");
                return;
            }

            const parametros =
                new URLSearchParams(window.location.search);

            const restauranteId =
                parametros.get("restaurante");

            window.location.href =
                `/finalizar.html?restaurante=${restauranteId}`;
        }

        carregarCarrinho();

    </script>

</body>
</html>
