<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Gustum</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1e293b
                );

            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: #ffffff;
            color: #111827;

            padding: 35px 30px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;

            font-size: 34px;
        }

        .logo p {
            margin-top: 8px;

            color: #64748b;

            font-size: 15px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;
        }

        .campo input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .campo input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .botao-login {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .botao-login:hover {
            background: #1d4ed8;
        }

        .mensagem {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }

        .mensagem.erro {
            display: block;

            background: #fee2e2;

            color: #991b1b;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">

            <h1>🍽️ DeliveryWhats</h1>

            <p>
                Acesso do restaurante
            </p>

        </div>

        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <button
                type="submit"
                class="botao-login"
            >
                Entrar
            </button>

        </form>

        <div
            id="mensagem"
            class="mensagem"
        ></div>

    </div>


<script>

    document
        .getElementById("formLogin")
        .addEventListener("submit", async function (evento) {

            evento.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            mensagem.className = "mensagem";
            mensagem.textContent = "";

            try {

                const resposta =
                    await fetch("/api/login-restaurante", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            senha: senha
                        })

                    });

                const dados =
                    await resposta.json();

                if (!dados.sucesso) {

                    mensagem.className =
                        "mensagem erro";

                    mensagem.textContent =
                        dados.erro || "Não foi possível entrar.";

                    return;
                }

                localStorage.setItem(
                    "restauranteId",
                    String(dados.restaurante.id)
                );

                localStorage.setItem(
                    "restauranteNome",
                    dados.restaurante.nome
                );

                window.location.href =
                    "/painel.html";

            } catch (erro) {

                console.error(
                    "Erro ao fazer login:",
                    erro
                );

                mensagem.className =
                    "mensagem erro";

                mensagem.textContent =
                    "Erro de conexão com o servidor.";

            }

        });

</script>



</body>

</html>
