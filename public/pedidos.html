<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Gustum</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 20px;
    }

    .topo-pedidos {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .topo-pedidos h1 {
        margin: 0;
    }

    .botao-voltar {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #333;
        color: white;
        font-size: 15px;
    }

    #pedidos {
        width: 100%;
        max-width: 600px;
        margin: 30px auto;
    }

    .baralho {
        position: relative;
        width: 100%;
        height: 560px;
    }

    .card-pedido {
        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        box-sizing: border-box;

        background: white;
        border-radius: 18px;
        padding: 24px;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.18);

        transition:
            transform 0.3s ease,
            opacity 0.3s ease;

        min-height: 500px;
    }

    .card-pedido:nth-child(1) {
        z-index: 10;
        transform: translateY(0);
    }

    .card-pedido:nth-child(2) {
        z-index: 9;
        transform: translateY(15px) scale(0.98);
    }

    .card-pedido:nth-child(3) {
        z-index: 8;
        transform: translateY(30px) scale(0.96);
    }

    .card-pedido:nth-child(4) {
        z-index: 7;
        transform: translateY(45px) scale(0.94);
    }

    .card-pedido:nth-child(5) {
        z-index: 6;
        transform: translateY(60px) scale(0.92);
    }

    .card-pedido:nth-child(n+6) {
        z-index: 5;
        transform: translateY(75px) scale(0.90);
    }

    .card-pedido h2 {
        margin-top: 0;
    }

    .total-pedido {
        font-size: 20px;
        font-weight: bold;
    }

    .botao-iniciar {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        cursor: pointer;
        margin-top: 15px;
    }
</style>

</head>

<body>

    <div class="topo-pedidos">

        <h1>📦 Pedidos</h1>

        <button
            class="botao-voltar"
            onclick="voltarPainel()"
        >
            ← Voltar ao painel
        </button>

    </div>

    <h2>🕐 Fila de pedidos</h2>

    <div id="pedidos">
        Carregando pedidos...
    </div>

    <h2>👨‍🍳 Em preparo</h2>

    <div id="pedidosEmPreparo">
        Nenhum pedido em preparo.
    </div>

    <script>

        async function carregarPedidos() {

            const container =
                document.getElementById("pedidos");

            try {

                const resposta =
                    await fetch("/api/pedidos?restaurante=1");

                const dados =
                    await resposta.json();

                if (!dados.sucesso) {
                    container.innerHTML =
                        "<p>Erro ao carregar pedidos.</p>";
                    return;
                }

                if (dados.pedidos.length === 0) {

                    container.innerHTML =
                        "<p>📭 Nenhum pedido recebido.</p>";

                    return;
                }

                const pedidosFila = dados.pedidos.filter(
                    pedido => pedido.status === "novo"
                );

                const pedidosEmPreparo = dados.pedidos.filter(
                    pedido => pedido.status === "em_preparo"
                );

                const containerPreparo =
                    document.getElementById("pedidosEmPreparo");

                if (pedidosEmPreparo.length === 0) {

                    containerPreparo.innerHTML =
                        "<p>Nenhum pedido em preparo.</p>";

                } else {

                    containerPreparo.innerHTML =
                        pedidosEmPreparo.map(pedido => `

                            <div class="card-pedido">

                                <h2>
                                    🍽️ Pedido #${pedido.id}
                                </h2>

                                <p>
                                    <strong>Status:</strong>
                                    👨‍🍳 Em preparo
                                </p>

                                <h3>Itens</h3>

                                <ul>
                                    ${pedido.itens.map(item => `
                                        <li>
                                            ${item.quantidade}x
                                            ${item.nome}
                                        </li>
                                    `).join("")}
                                </ul>

                                <p class="total-pedido">
                                    Total:
                                    R$ ${Number(pedido.total)
                                        .toFixed(2)
                                        .replace(".", ",")}
                                </p>

                                <button
                                    class="botao-pronto"
                                    onclick="marcarComoPronto(${pedido.id})"
                                >
                                    ✅ Marcar como pronto
                                </button>

                            </div>

                        `).join("");
                }

                if (pedidosFila.length === 0) {

                    container.innerHTML =
                        "<p>📭 Nenhum pedido aguardando.</p>";

                    return;
                }

                container.innerHTML = `
                    <div class="baralho">

                        ${pedidosFila.map((pedido, indice) => `

                            <div class="card-pedido">

                                <h2>
                                    🍽️ Pedido #${pedido.id}
                                </h2>

                                <p>
                                    <strong>Status:</strong>
                                    ${pedido.status}
                                </p>

                                <h3>Itens</h3>

                                <ul>

                                    ${pedido.itens.map(item => `
                                        <li>
                                            ${item.quantidade}x
                                            ${item.nome}
                                        </li>
                                    `).join("")}

                                </ul>

                                <p class="total-pedido">
                                    Total:
                                    R$ ${Number(pedido.total)
                                        .toFixed(2)
                                        .replace(".", ",")}
                                </p>

                                <p>
                                    📱 ${pedido.telefone}
                                </p>

                                <p>
                                    💳 ${pedido.forma_pagamento}
                                </p>

                                <p>
                                    📦 ${
                                        pedido.tipo_entrega === "entrega"
                                            ? "🛵 Entrega"
                                            : "🏪 Retirada no local"
                                    }
                                </p>

                                ${
                                    pedido.tipo_entrega === "entrega"
                                        ? `
                                            <p>
                                                📍 ${pedido.endereco || ""}
                                            </p>
                                        `
                                        : ""
                                }

                                <p>
                                    📝 ${
                                        pedido.observacao ||
                                        "Nenhuma observação"
                                    }
                                </p>

                                ${
                                    indice === 0
                                        ? `
                                            <button
                                                class="botao-iniciar"
                                                onclick="iniciarPreparo(${pedido.id})"
                                            >
                                                ▶️ Iniciar preparo
                                            </button>
                                        `
                                        : ""
                                }

                            </div>

                        `).join("")}

                    </div>
                `;

            } catch (erro) {

                console.error(
                    "Erro ao carregar pedidos:",
                    erro
                );

                container.innerHTML =
                    "<p>Erro de comunicação com o servidor.</p>";
            }
        }


        async function iniciarPreparo(pedidoId) {

            try {

                const resposta = await fetch(
                    `/api/pedidos/${pedidoId}/iniciar-preparo`,
                    {
                        method: "PUT"
                    }
                );

                const dados = await resposta.json();

                console.log(dados);

                if (!resposta.ok || !dados.sucesso) {

                    alert(
                        dados.erro ||
                        "Não foi possível iniciar o preparo."
                    );

                    return;
                }

                carregarPedidos();

            } catch (erro) {

                console.error(
                    "Erro ao iniciar preparo:",
                    erro
                );

                alert(
                    "Erro de comunicação com o servidor."
                );
            }
        }


        async function marcarComoPronto(pedidoId) {

            try {

                const resposta = await fetch(
                    `/api/pedidos/${pedidoId}/marcar-pronto`,
                    {
                        method: "PUT"
                    }
                );

                const dados = await resposta.json();

                console.log(dados);

                if (!resposta.ok || !dados.sucesso) {

                    alert(
                        dados.erro ||
                        "Não foi possível marcar o pedido como pronto."
                    );

                    return;
                }

                carregarPedidos();

            } catch (erro) {

                console.error(
                    "Erro ao marcar pedido como pronto:",
                    erro
                );

                alert(
                    "Erro de comunicação com o servidor."
                );
            }
        }


        carregarPedidos();

    </script>

</body>

</html>
