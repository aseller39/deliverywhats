<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Gustum</title>
</head>

<body>

    <h1>📦 Pedidos</h1>

    <button onclick="voltarPainel()">
        ← Voltar ao painel
    </button>

    <hr>

    <h2>🆕 Novos pedidos</h2>

    <div id="pedidos">
        Carregando pedidos...
    </div>

    <script>

        async function carregarPedidos() {

            const container =
                document.getElementById("pedidos");

            try {

                const resposta =
                    await fetch("/api/pedidos?restaurante=1");

                const dados =
                    await resposta.json();

                if (!dados.sucesso) {
                    container.innerHTML =
                        "<p>Erro ao carregar pedidos.</p>";
                    return;
                }

                if (dados.pedidos.length === 0) {

                    container.innerHTML =
                        "<p>📭 Nenhum pedido recebido.</p>";

                    return;
                }

                container.innerHTML =
                    dados.pedidos.map(pedido => `

                        <div>

                            <h2>
                                🍽️ Pedido #${pedido.id}
                            </h2>

                            <p>
                                <strong>Status:</strong>
                                ${pedido.status}
                            </p>

                            <h3>Itens</h3>

                            <ul>

                                ${pedido.itens.map(item => `
                                    <li>
                                        ${item.quantidade}x
                                        ${item.nome}
                                    </li>
                                `).join("")}

                            </ul>

                            <p>
                                <strong>
                                    Total:
                                </strong>

                                R$ ${Number(pedido.total)
                                    .toFixed(2)
                                    .replace(".", ",")}
                            </p>

                            <p>
                                📱 ${pedido.telefone}
                            </p>

                            <p>
                                💳 ${pedido.forma_pagamento}
                            </p>

                            <p>
                                📦 ${
                                    pedido.tipo_entrega === "entrega"
                                        ? "🛵 Entrega"
                                        : "🏪 Retirada no local"
                                }
                            </p>

                            ${
                                pedido.tipo_entrega === "entrega"
                                    ? `
                                        <p>
                                            📍 ${pedido.endereco || ""}
                                        </p>
                                    `
                                    : ""
                            }

                            <p>
                                📝 ${
                                    pedido.observacao ||
                                    "Nenhuma observação"
                                }
                            </p>

                            <hr>

                        </div>

                    `).join("");

            } catch (erro) {

                console.error(
                    "Erro ao carregar pedidos:",
                    erro
                );

                container.innerHTML =
                    "<p>Erro de comunicação com o servidor.</p>";
            }
        }


        carregarPedidos();

    </script>

</body>

</html>
