<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Delivery Fácil</title>
    <style>

        #listaProdutos {
            width: 100%;
        }

        .secao-produtos {
            margin-top: 30px;
        }

        .secao-produtos > h2 {
            margin-bottom: 15px;
        }

        .grade-produtos-painel {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .card-produto-painel {
            background: white;
            border-radius: 14px;
            padding: 18px;
            width: 280px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .topo-card-produto {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .topo-card-produto h3 {
            margin: 0;
        }

        .descricao-produto {
            color: #555;
            min-height: 40px;
        }

        .precos-produto {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .precos-produto span {
            font-weight: bold;
        }

        .status-disponivel {
            font-size: 13px;
        }

        .status-indisponivel {
            font-size: 13px;
        }

        .acoes-produto {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .acoes-produto button {
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            cursor: pointer;
        }

    </style>
</head>
<body>

  <h1>Bem-vindo ao painel do Gustum.</h1>

    <button onclick="abrirNovoProduto()">
    ➕ Novo produto
    </button>

    <div id="formularioProduto" style="display: none;">

        <h2>Novo produto</h2>

        <input
            type="text"
            id="nomeProduto"
            placeholder="Nome do produto"
        >

        <br><br>

        <textarea
            id="descricaoProduto"
            placeholder="Descrição do produto"
            rows="3"
        ></textarea>

        <br><br>

        <label>
            Categoria:
            <select id="categoriaProduto" onchange="alterarCamposProduto()">
                <option value="prato">Prato</option>
                <option value="porcao">Porção</option>
                <option value="bebida">Bebida</option>
            </select>
        </label>

        <div id="precosPrato">

            <br>

            <input
                type="number"
                id="precoPequena"
                placeholder="Preço pequena"
                step="0.01"
            >

            <br><br>

            <input
                type="number"
                id="precoMedia"
                placeholder="Preço média"
                step="0.01"
            >

            <br><br>

            <input
                type="number"
                id="precoGrande"
                placeholder="Preço grande"
                step="0.01"
            >

        </div>

        <div id="precoPorcao" style="display: none;">

            <br>

            <input
                type="number"
                id="precoKg"
                placeholder="Preço por kg"
                step="0.01"
            >

        </div>

        <div id="precoBebida" style="display: none;">

            <br>

            <input
                type="number"
                id="precoBebidaInput"
                placeholder="Preço da bebida"
                step="0.01"
            >

        </div>

        <br>

        <button onclick="salvarProduto()">
            💾 Salvar produto
        </button>

        <button onclick="fecharNovoProduto()">
            Cancelar
        </button>

        <p id="statusProduto"></p>

    </div>

  <h2>📢 Avisos do dia</h2>

    <input
        type="text"
        id="tituloAviso"
        placeholder="Título do aviso"
    >

    <br><br>

    <textarea
        id="mensagemAviso"
        placeholder="Digite o aviso para os clientes"
        rows="4"
    ></textarea>

    <br><br>

    <label>
        Data de início:
        <input type="date" id="dataInicioAviso">
        </label>

        <br><br>

        <label>
        Data de fim:
        <input type="date" id="dataFimAviso">
    </label>

    <br><br>

    <button onclick="publicarAviso()">
        Publicar aviso
    </button>

    <p id="statusAviso"></p>

    <div id="avisos"></div>
  

    <hr>

<h2>📋 Produtos cadastrados</h2>

<div id="listaProdutos"></div>

  <script>
    async function carregarPratos() {
        const resposta = await fetch("/api/cardapio?restaurante=1");
        const dados = await resposta.json();

        const painel = document.getElementById("pratos");

        for (const prato of dados.pratos) {

            const respostaIngredientes = await fetch(
                `/api/pratos/${prato.id}/ingredientes`
            );

            const dadosIngredientes = await respostaIngredientes.json();

            painel.innerHTML += `
                <div>
                <h2>${prato.nome}</h2>

                <p>${prato.descricao}</p>

                <p>
                    ${
                        prato.categoria === "porcao"
                            ? `R$ ${Number(prato.preco_kg)
                                .toFixed(2)
                                .replace(".", ",")} / kg`
                            : `
                                P: R$ ${Number(prato.preco_pequena)
                                    .toFixed(2)
                                    .replace(".", ",")}
                                |
                                M: R$ ${Number(prato.preco_media)
                                    .toFixed(2)
                                    .replace(".", ",")}
                                |
                                G: R$ ${Number(prato.preco_grande)
                                    .toFixed(2)
                                    .replace(".", ",")}
                            `
                    }
                </p>

                <h3>Ingredientes</h3>

                <ul>
                    ${dadosIngredientes.ingredientes.map(ingrediente => `
                    <li>
                        ${ingrediente.nome}
                        — ${ingrediente.disponivel ? "Disponível" : "Indisponível"}
                    </li>
                    `).join("")}
                </ul>
            </div>
        `;
        }
    }


    carregarPratos();
    carregarAvisos();
    carregarProdutosPainel();

    async function publicarAviso() {
        const titulo = document.getElementById("tituloAviso").value;
        const mensagem = document.getElementById("mensagemAviso").value;
        const dataInicio = document.getElementById("dataInicioAviso").value;
        const dataFim = document.getElementById("dataFimAviso").value;

        if (dataInicio && dataFim && dataInicio > dataFim) {
            document.getElementById("statusAviso").textContent =
                "❌ A data de início não pode ser maior que a data de fim.";
            return;
        }

        if (!titulo.trim() || !mensagem.trim()) {
            alert("Preencha o título e a mensagem.");
            return;
        }

        const botao = document.querySelector('button[onclick="publicarAviso()"]');

        botao.disabled = true;

        const resposta = await fetch("/api/avisos", {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
            },
            body: JSON.stringify({
            restaurante_id: 1,
            titulo: titulo,
            mensagem: mensagem,
            data_inicio: dataInicio || null,
            data_fim: dataFim || null
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            document.getElementById("statusAviso").textContent =
                `❌ ${dados.erro || "Não foi possível publicar o aviso."}`;

            botao.disabled = false;
            return;
        }

        console.log(dados);

        botao.disabled = false;

        if (dados.sucesso) {
            document.getElementById("statusAviso").textContent =
                "✅ Aviso publicado com sucesso!";

            document.getElementById("tituloAviso").value = "";
            document.getElementById("mensagemAviso").value = "";

            carregarAvisos();
        } else {
            document.getElementById("statusAviso").textContent =
                `❌ ${dados.erro || "Não foi possível publicar o aviso."}`;
        }
    }


    async function carregarAvisos() {
        const resposta = await fetch("/api/avisos?restaurante=1");
        const dados = await resposta.json();

        const container = document.getElementById("avisos");

        container.innerHTML = dados.avisos.map(aviso => `
            <div>
                <h3>${aviso.titulo}</h3>
                <p>${aviso.mensagem}</p>

                <p>
                    Status: ${aviso.ativo ? "Ativo" : "Inativo"}
                </p>

                <button onclick="alterarAviso(${aviso.id}, ${!aviso.ativo})">
                    ${aviso.ativo ? "Desativar aviso" : "Ativar aviso"}
                </button>
            </div>
        `).join("");
    }


    async function alterarAviso(id, ativo) {
        const resposta = await fetch(`/api/avisos/${id}/ativo`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                ativo: ativo
            })
        });

        const dados = await resposta.json();

        console.log(dados);

        carregarAvisos();
    }


    function alterarCamposProduto() {

        const categoria =
            document.getElementById("categoriaProduto").value;

        const precosPrato =
            document.getElementById("precosPrato");

        const precoPorcao =
            document.getElementById("precoPorcao");

        const precoBebida =
            document.getElementById("precoBebida");

        precosPrato.style.display = "none";
        precoPorcao.style.display = "none";
        precoBebida.style.display = "none";

        if (categoria === "prato") {

            precosPrato.style.display = "block";

        } else if (categoria === "porcao") {

            precoPorcao.style.display = "block";

        } else if (categoria === "bebida") {

            precoBebida.style.display = "block";

        }
    }

    function abrirNovoProduto() {

        document.getElementById("formularioProduto").style.display = "block";

    }

    function fecharNovoProduto() {

        document.getElementById("formularioProduto").style.display = "none";

    }


    async function salvarProduto() {

        const nome =
            document.getElementById("nomeProduto").value.trim();

        const descricao =
            document.getElementById("descricaoProduto").value.trim();

        const categoria =
            document.getElementById("categoriaProduto").value;

        const status =
            document.getElementById("statusProduto");

        if (!nome) {

            status.textContent =
                "❌ Informe o nome do produto.";

            return;
        }

        let dadosProduto = {
            restaurante_id: 1,
            nome: nome,
            descricao: descricao,
            categoria: categoria,
            preco: 0,
            preco_pequena: null,
            preco_media: null,
            preco_grande: null,
            preco_kg: null
        };

        if (categoria === "prato") {

            dadosProduto.preco_pequena =
                Number(document.getElementById("precoPequena").value);

            dadosProduto.preco_media =
                Number(document.getElementById("precoMedia").value);

            dadosProduto.preco_grande =
                Number(document.getElementById("precoGrande").value);

            dadosProduto.preco =
                dadosProduto.preco_media;

        }

        if (categoria === "porcao") {

            dadosProduto.preco_kg =
                Number(document.getElementById("precoKg").value);

            dadosProduto.preco =
                dadosProduto.preco_kg;

        }

        if (categoria === "bebida") {

            dadosProduto.preco =
                Number(
                    document.getElementById("precoBebidaInput").value
                );

        }

        if (!dadosProduto.preco || dadosProduto.preco <= 0) {

            status.textContent =
                "❌ Informe um preço válido.";

            return;
        }

        try {

            const resposta = await fetch("/api/pratos", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(dadosProduto)

            });

            const dados = await resposta.json();

            console.log(dados);

            if (!resposta.ok || !dados.sucesso) {

                status.textContent =
                    `❌ ${dados.erro || "Erro ao cadastrar produto."}`;

                return;
            }

            status.textContent =
                "✅ Produto cadastrado com sucesso!";

            document.getElementById("nomeProduto").value = "";
            document.getElementById("descricaoProduto").value = "";

            document.getElementById("precoPequena").value = "";
            document.getElementById("precoMedia").value = "";
            document.getElementById("precoGrande").value = "";

            document.getElementById("precoKg").value = "";
            document.getElementById("precoBebidaInput").value = "";

        } catch (erro) {

            console.error("Erro ao cadastrar produto:", erro);

            status.textContent =
                "❌ Erro de comunicação com o servidor.";

        }
    }


    async function carregarProdutosPainel() {

        const resposta =
            await fetch("/api/painel/produtos?restaurante=1");

        const dados =
            await resposta.json();

        const container =
            document.getElementById("listaProdutos");

        if (!dados.sucesso || !dados.pratos.length) {

            container.innerHTML =
                "<p>Nenhum produto cadastrado.</p>";

            return;
        }

        const pratos = dados.pratos.filter(
            produto => produto.categoria === "prato"
        );

        const porcoes = dados.pratos.filter(
            produto => produto.categoria === "porcao"
        );

        const bebidas = dados.pratos.filter(
            produto => produto.categoria === "bebida"
        );


        function criarCards(lista) {

            return lista.map(produto => {

                let preco = "";

                if (produto.categoria === "prato") {

                    preco = `
                        <div class="precos-produto">
                            <span>P: R$ ${Number(produto.preco_pequena)
                                .toFixed(2).replace(".", ",")}</span>

                            <span>M: R$ ${Number(produto.preco_media)
                                .toFixed(2).replace(".", ",")}</span>

                            <span>G: R$ ${Number(produto.preco_grande)
                                .toFixed(2).replace(".", ",")}</span>
                        </div>
                    `;

                } else if (produto.categoria === "porcao") {

                    preco = `
                        <strong>
                            R$ ${Number(produto.preco_kg)
                                .toFixed(2).replace(".", ",")} / kg
                        </strong>
                    `;

                } else {

                    preco = `
                        <strong>
                            R$ ${Number(produto.preco)
                                .toFixed(2).replace(".", ",")}
                        </strong>
                    `;
                }

                return `
                    <div class="card-produto-painel">

                        <div class="topo-card-produto">

                            <h3>${produto.nome}</h3>

                            <span class="${
                                produto.disponivel
                                    ? "status-disponivel"
                                    : "status-indisponivel"
                            }">

                                ${
                                    produto.disponivel
                                        ? "🟢 Disponível"
                                        : "🔴 Indisponível"
                                }

                            </span>

                        </div>

                        <p class="descricao-produto">
                            ${produto.descricao || ""}
                        </p>

                        ${preco}

                        <div class="acoes-produto">

                            <button
                                onclick="editarProduto(${produto.id})"
                            >
                                ✏️ Editar
                            </button>

                            <button
                                onclick="alterarDisponibilidade(
                                    ${produto.id},
                                    ${!produto.disponivel}
                                )"
                            >
                                ${
                                    produto.disponivel
                                        ? "🔴 Desativar"
                                        : "🟢 Ativar"
                                }
                            </button>

                        </div>

                    </div>
                `;

            }).join("");
        }


        let html = "";


        if (pratos.length > 0) {

            html += `
                <section class="secao-produtos">

                    <h2>🍽️ Pratos</h2>

                    <div class="grade-produtos-painel">
                        ${criarCards(pratos)}
                    </div>

                </section>
            `;
        }


        if (porcoes.length > 0) {

            html += `
                <section class="secao-produtos">

                    <h2>🥩 Porções</h2>

                    <div class="grade-produtos-painel">
                        ${criarCards(porcoes)}
                    </div>

                </section>
            `;
        }


        if (bebidas.length > 0) {

            html += `
                <section class="secao-produtos">

                    <h2>🥤 Bebidas</h2>

                    <div class="grade-produtos-painel">
                        ${criarCards(bebidas)}
                    </div>

                </section>
            `;
        }


        container.innerHTML = html;
    }


    async function alterarDisponibilidade(id, disponivel) {

        try {

            const resposta = await fetch(
                `/api/pratos/${id}/disponibilidade`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        disponivel: disponivel
                    })
                }
            );

            const dados = await resposta.json();

            console.log(dados);

            if (!resposta.ok || !dados.sucesso) {

                alert(
                    dados.erro ||
                    "Não foi possível alterar a disponibilidade."
                );

                return;
            }

            carregarProdutosPainel();

        } catch (erro) {

            console.error(
                "Erro ao alterar disponibilidade:",
                erro
            );

            alert(
                "Erro de comunicação com o servidor."
            );
        }
    }


    </script>

</body>
</html>
