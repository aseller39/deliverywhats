<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Delivery Fácil</title>
</head>
<body>

  <h1>Painel do Restaurante</h1>

  <p>Bem-vindo ao painel do Gustum.</p>
  
  <div id="pratos"></div>

  <script>
    async function carregarPratos() {
        const resposta = await fetch("/api/cardapio?restaurante=1");
        const dados = await resposta.json();

        const painel = document.getElementById("pratos");

        painel.innerHTML = dados.pratos.map(prato => `
            <div>
                <h2>${prato.nome}</h2>
                <p>${prato.descricao}</p>
                <p>R$ ${Number(prato.preco).toFixed(2).replace(".", ",")}</p>
                <p>Disponível: ${prato.disponivel ? "Sim" : "Não"}</p>
            </div>
        `).join("");
    }

    carregarPratos();
    </script>

</body>
</html>
