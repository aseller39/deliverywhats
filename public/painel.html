<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Delivery Fácil</title>
    <style>

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #1e293b 0%,
                    #0f172a 45%,
                    #020617 100%
                );

            color: #f8fafc;

            min-height: 100vh;
        }

        .titulo-painel {
            text-align: center;
            margin: 10px 0 30px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
        }

        #listaProdutos {
            width: 100%;
        }

        .secao-produtos {
            margin-top: 30px;
        }

        .secao-produtos > h2 {
            margin-bottom: 15px;
        }

        .grade-produtos-painel {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .card-produto-painel {
            background: white;
            border-radius: 14px;
            padding: 18px;
            width: 280px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .foto-produto-painel {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    margin-bottom: 12px;
}

        .topo-card-produto {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .topo-card-produto h3 {
            margin: 0;
        }

        .descricao-produto {
            color: #555;
            min-height: 40px;
        }

        .precos-produto {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .precos-produto span {
            font-weight: bold;
        }

        .status-disponivel {
            font-size: 13px;
        }

        .status-indisponivel {
            font-size: 13px;
        }

        .acoes-produto {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .acoes-produto button {
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            cursor: pointer;
        }

        .modal-editar-produto {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .conteudo-modal-editar {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 25px;
            position: relative;
            box-sizing: border-box;
        }

        .conteudo-modal-editar > button:first-child {
            position: absolute;
            right: 12px;
            top: 12px;
            border: none;
            background: none;
            font-size: 22px;
            cursor: pointer;
        }

        .conteudo-modal-editar label {
            display: block;
            font-weight: bold;
        }

        .conteudo-modal-editar input,
        .conteudo-modal-editar textarea,
        .conteudo-modal-editar select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .card-produto-painel {
            background: #1e293b;
            color: #f8fafc;

            border: 1px solid #334155;
            border-radius: 16px;

            padding: 20px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .card-produto-painel:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.45);
        }

        .card-produto-painel h3 {
            color: #ffffff;
            font-size: 22px;
            margin: 0;
        }

        .card-produto-painel .descricao-produto {
            color: #cbd5e1;
            line-height: 1.5;
        }

        .card-produto-painel .precos-produto {
            color: #ffffff;
            font-weight: bold;
        }

        .card-produto-painel strong {
            color: #ffffff;
            font-size: 18px;
        }

        .card-produto-painel .status-disponivel {
            color: #4ade80;
            font-weight: bold;
        }

        .card-produto-painel .status-indisponivel {
            color: #f87171;
            font-weight: bold;
        }

        .card-produto-painel .acoes-produto {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .card-produto-painel .acoes-produto button {
            margin: 0;
        }

        .card-aviso {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;

            padding: 24px;
            margin-bottom: 30px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .card-aviso input[type="text"],
        .card-aviso textarea,
        .card-aviso input[type="date"] {
            width: 100%;
            box-sizing: border-box;

            background: #0f172a;
            color: #f8fafc;

            border: 1px solid #475569;
            border-radius: 10px;

            padding: 12px;
            margin-top: 6px;

            font-size: 15px;
        }

        .card-aviso textarea {
            resize: vertical;
        }

        .card-aviso label {
            display: block;
            color: #e2e8f0;
            font-weight: 600;
            margin-top: 15px;
        }

        .card-aviso button {
            margin: 0;
        }

        .cabecalho-produtos {
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            align-items: center;

            margin: 30px 0;
            gap: 20px;
        }

        .grupo-produtos {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .cabecalho-produtos h2 {
            margin: 0;
            text-align: left;
            color: #ffffff;
            font-size: 28px;
        }

        .cabecalho-produtos .botao-novo-produto {
            justify-self: start;
            margin: 0;
        }

        .cabecalho-produtos .botao-pedidos {
            justify-self: end;
            margin: 0;

            background: #2563eb;
            color: #ffffff;

            border: 1px solid #3b82f6;

            padding: 14px 24px;
            border-radius: 12px;

            font-size: 17px;
            font-weight: 700;

            box-shadow:
                0 6px 18px rgba(37, 99, 235, 0.35);
        }

        .cabecalho-produtos .botao-pedidos:hover {
            background: #3b82f6;

            transform: translateY(-2px);

            box-shadow:
                0 10px 24px rgba(37, 99, 235, 0.45);
        }

        #contadorPedidos {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 24px;
            height: 24px;

            margin-left: 6px;
            padding: 0 6px;

            background: #ef4444;
            color: #ffffff;

            border-radius: 50%;

            font-size: 13px;
            font-weight: bold;
        }

    </style>
</head>
<body>

  <h1 class="titulo-painel">
        Bem-vindo ao painel do Gustum.
    </h1>


    

  <h2>📢 Avisos do dia</h2>
<div class="card-aviso">
    <input
        type="text"
        id="tituloAviso"
        placeholder="Título do aviso"
    >

    <br><br>

    <textarea
        id="mensagemAviso"
        placeholder="Digite o aviso para os clientes"
        rows="4"
    ></textarea>

    

    <label>
        Data de início:
        <input type="date" id="dataInicioAviso">
        </label>

        <br><br>

        <label>
        Data de fim:
        <input type="date" id="dataFimAviso">
    </label>

    <br><br>

    <button onclick="publicarAviso()">
        Publicar aviso
    </button>
</div>
    <p id="statusAviso"></p>

    <div id="avisos"></div>
  

    <hr>

    

<div class="cabecalho-produtos">

    <div class="grupo-produtos">

    <button
        class="botao-novo-produto"
        onclick="abrirNovoProduto()"
    >
        ➕ Novo produto
    </button>

    <button
        class="botao-novo-produto"
        onclick="abrirCardapioSemana()"
    >
        📅 Cardápio da Semana
    </button>

    <h2>
        📋 Produtos cadastrados
    </h2>

</div>

    <button
        class="botao-pedidos"
        onclick="abrirPedidos()"
    >
        📦 Pedidos
        <span id="contadorPedidos">0</span>
    </button>

</div>


<div id="formularioProduto" style="display: none;">

        <h2>Novo produto</h2>

        <input
            type="text"
            id="nomeProduto"
            placeholder="Nome do produto"
        >

        <br><br>

        <textarea
            id="descricaoProduto"
            placeholder="Descrição do produto"
            rows="3"
        ></textarea>

        <br><br>

        <label>
            📷 Foto do produto:
            <input
                type="file"
                id="fotoProduto"
                accept="image/*"
            >
        </label>

        <br><br>

        <label>
            Categoria:
            <select id="categoriaProduto" onchange="alterarCamposProduto()">
                <option value="prato">Prato</option>
                <option value="porcao">Porção</option>
                <option value="bebida">Bebida</option>
            </select>
        </label>

        <div id="precosPrato">

            <br>

            <input
                type="number"
                id="precoPequena"
                placeholder="Preço pequena"
                step="0.01"
            >

            <br><br>

            <input
                type="number"
                id="precoMedia"
                placeholder="Preço média"
                step="0.01"
            >

            <br><br>

            <input
                type="number"
                id="precoGrande"
                placeholder="Preço grande"
                step="0.01"
            >

        </div>

        <div id="precoPorcao" style="display: none;">

            <br>

            <input
                type="number"
                id="precoKg"
                placeholder="Preço por kg"
                step="0.01"
            >

        </div>

        <div id="precoBebida" style="display: none;">

            <br>

            <input
                type="number"
                id="precoBebidaInput"
                placeholder="Preço da bebida"
                step="0.01"
            >

        </div>

        <br>

        <button onclick="salvarProduto()">
            💾 Salvar produto
        </button>

        <button onclick="fecharNovoProduto()">
            Cancelar
        </button>

        <p id="statusProduto"></p>

    </div>


   <div id="formularioCardapioSemana" style="display: none;">

    <h2>📅 Cardápio da Semana</h2>

    <label>
        Dia da semana:
        <select id="diaCardapio" onchange="carregarDiaCardapio()">
            <option value="1">Segunda-feira</option>
            <option value="2">Terça-feira</option>
            <option value="3">Quarta-feira</option>
            <option value="4">Quinta-feira</option>
            <option value="5">Sexta-feira</option>
        </select>
    </label>

    <br><br>

    <input
        type="text"
        id="tituloCardapio"
        placeholder="Título do prato"
    >

    <br><br>

    <textarea
        id="descricaoCardapio"
        placeholder="Descrição do prato"
        rows="4"
    ></textarea>

    <br><br>

    <label>
        Preço Pequena:
    </label>

    <input
        type="number"
        id="precoPequenaCardapio"
        step="0.01"
        placeholder="R$ 0,00"
    >

    <br><br>

    <label>
        Preço Média:
    </label>

    <input
        type="number"
        id="precoMediaCardapio"
        step="0.01"
        placeholder="R$ 0,00"
    >

    <br><br>

    <label>
        Preço Grande:
    </label>

    <input
        type="number"
        id="precoGrandeCardapio"
        step="0.01"
        placeholder="R$ 0,00"
    >

    <br><br>

    <label>
        Foto do prato:
    </label>

    <input
        type="file"
        id="fotoCardapio"
        accept="image/*"
    >

    <br><br>

    <input
        type="text"
        id="carne1Cardapio"
        placeholder="Primeira opção de carne"
    >

    <br><br>

    <input
        type="text"
        id="carne2Cardapio"
        placeholder="Segunda opção de carne"
    >

    <br><br>

    <button onclick="salvarCardapioSemana()">
        💾 Salvar dia
    </button>

    <button onclick="fecharCardapioSemana()">
        Cancelar
    </button>

    <p id="statusCardapioSemana"></p>

</div>


<div id="listaProdutos"></div>

  <script>


function abrirCardapioSemana() {

    document.getElementById("formularioProduto").style.display = "none";
    document.getElementById("listaProdutos").style.display = "none";

    document.getElementById("formularioCardapioSemana").style.display = "block";

    carregarDiaCardapio();
}


async function carregarDiaCardapio() {

    const dia =
        document.getElementById("diaCardapio").value;

    const resposta = await fetch(
        `/api/cardapio-semana?restaurante=1&dia=${dia}`
    );

    const dados = await resposta.json();

    const titulo =
        document.getElementById("tituloCardapio");

    const descricao =
        document.getElementById("descricaoCardapio");

    const precoPequena =
        document.getElementById("precoPequenaCardapio");

    const precoMedia =
        document.getElementById("precoMediaCardapio");

    const precoGrande =
        document.getElementById("precoGrandeCardapio");

    const carne1 =
        document.getElementById("carne1Cardapio");

    const carne2 =
        document.getElementById("carne2Cardapio");

    if (dados.sucesso && dados.cardapio) {

        const cardapio = dados.cardapio;

        titulo.value =
            cardapio.titulo || "";

        descricao.value =
            cardapio.descricao || "";

        precoPequena.value =
            cardapio.preco_pequena || "";

        precoMedia.value =
            cardapio.preco_media || "";

        precoGrande.value =
            cardapio.preco_grande || "";

        carne1.value =
            cardapio.carne_1 || "";

        carne2.value =
            cardapio.carne_2 || "";

    } else {

        titulo.value = "";
        descricao.value = "";
        precoPequena.value = "";
        precoMedia.value = "";
        precoGrande.value = "";
        carne1.value = "";
        carne2.value = "";
    }
}


async function salvarCardapioSemana() {

    const dia =
        document.getElementById("diaCardapio").value;

    const titulo =
        document.getElementById("tituloCardapio").value.trim();

    const descricao =
        document.getElementById("descricaoCardapio").value.trim();

    const precoPequena =
        Number(
            document.getElementById("precoPequenaCardapio").value
        );

    const precoMedia =
        Number(
            document.getElementById("precoMediaCardapio").value
        );

    const precoGrande =
        Number(
            document.getElementById("precoGrandeCardapio").value
        );

    const carne1 =
        document.getElementById("carne1Cardapio").value.trim();

    const carne2 =
        document.getElementById("carne2Cardapio").value.trim();

    const status =
        document.getElementById("statusCardapioSemana");

    if (
        !titulo ||
        !descricao ||
        !precoPequena ||
        !precoMedia ||
        !precoGrande ||
        !carne1 ||
        !carne2
    ) {

        status.textContent =
            "❌ Preencha todos os campos.";

        return;
    }

    try {

        const resposta = await fetch(
            "/api/cardapio-semana",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    restaurante_id: 1,

                    dia_semana: Number(dia),

                    titulo: titulo,

                    descricao: descricao,

                    preco_pequena: precoPequena,

                    preco_media: precoMedia,

                    preco_grande: precoGrande,

                    carne_1: carne1,

                    carne_2: carne2

                })
            }
        );

        const dados =
            await resposta.json();

        if (!resposta.ok || !dados.sucesso) {

            status.textContent =
                `❌ ${dados.erro || "Erro ao salvar."}`;

            return;
        }

        status.textContent =
            "✅ Cardápio salvo com sucesso!";

    } catch (erro) {

        console.error(
            "Erro ao salvar cardápio:",
            erro
        );

        status.textContent =
            "❌ Erro de comunicação com o servidor.";
    }
}


    async function carregarPratos() {
        const resposta = await fetch("/api/cardapio?restaurante=1");
        const dados = await resposta.json();

        const painel = document.getElementById("pratos");

        for (const prato of dados.pratos) {

            const respostaIngredientes = await fetch(
                `/api/pratos/${prato.id}/ingredientes`
            );

            const dadosIngredientes = await respostaIngredientes.json();

            painel.innerHTML += `
                <div>
                <h2>${prato.nome}</h2>

                <p>${prato.descricao}</p>

                <p>
                    ${
                        prato.categoria === "porcao"
                            ? `R$ ${Number(prato.preco_kg)
                                .toFixed(2)
                                .replace(".", ",")} / kg`
                            : `
                                P: R$ ${Number(prato.preco_pequena)
                                    .toFixed(2)
                                    .replace(".", ",")}
                                |
                                M: R$ ${Number(prato.preco_media)
                                    .toFixed(2)
                                    .replace(".", ",")}
                                |
                                G: R$ ${Number(prato.preco_grande)
                                    .toFixed(2)
                                    .replace(".", ",")}
                            `
                    }
                </p>

                <h3>Ingredientes</h3>

                <ul>
                    ${dadosIngredientes.ingredientes.map(ingrediente => `
                    <li>
                        ${ingrediente.nome}
                        — ${ingrediente.disponivel ? "Disponível" : "Indisponível"}
                    </li>
                    `).join("")}
                </ul>
            </div>
        `;
        }
    }


    carregarProdutosPainel();
    carregarAvisos();
    carregarProdutosPainel();

    async function publicarAviso() {
        const titulo = document.getElementById("tituloAviso").value;
        const mensagem = document.getElementById("mensagemAviso").value;
        const dataInicio = document.getElementById("dataInicioAviso").value;
        const dataFim = document.getElementById("dataFimAviso").value;

        if (dataInicio && dataFim && dataInicio > dataFim) {
            document.getElementById("statusAviso").textContent =
                "❌ A data de início não pode ser maior que a data de fim.";
            return;
        }

        if (!titulo.trim() || !mensagem.trim()) {
            alert("Preencha o título e a mensagem.");
            return;
        }

        const botao = document.querySelector('button[onclick="publicarAviso()"]');

        botao.disabled = true;

        const resposta = await fetch("/api/avisos", {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
            },
            body: JSON.stringify({
            restaurante_id: 1,
            titulo: titulo,
            mensagem: mensagem,
            data_inicio: dataInicio || null,
            data_fim: dataFim || null
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            document.getElementById("statusAviso").textContent =
                `❌ ${dados.erro || "Não foi possível publicar o aviso."}`;

            botao.disabled = false;
            return;
        }

        console.log(dados);

        botao.disabled = false;

        if (dados.sucesso) {
            document.getElementById("statusAviso").textContent =
                "✅ Aviso publicado com sucesso!";

            document.getElementById("tituloAviso").value = "";
            document.getElementById("mensagemAviso").value = "";

            carregarAvisos();
        } else {
            document.getElementById("statusAviso").textContent =
                `❌ ${dados.erro || "Não foi possível publicar o aviso."}`;
        }
    }


    async function carregarAvisos() {
        const resposta = await fetch("/api/avisos?restaurante=1");
        const dados = await resposta.json();

        const container = document.getElementById("avisos");

        container.innerHTML = dados.avisos.map(aviso => `
            <div>
                <h3>${aviso.titulo}</h3>
                <p>${aviso.mensagem}</p>

                <p>
                    Status: ${aviso.ativo ? "Ativo" : "Inativo"}
                </p>

                <button onclick="alterarAviso(${aviso.id}, ${!aviso.ativo})">
                    ${aviso.ativo ? "Desativar aviso" : "Ativar aviso"}
                </button>
            </div>
        `).join("");
    }


    async function alterarAviso(id, ativo) {
        const resposta = await fetch(`/api/avisos/${id}/ativo`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                ativo: ativo
            })
        });

        const dados = await resposta.json();

        console.log(dados);

        carregarAvisos();
    }


    function alterarCamposProduto() {

        const categoria =
            document.getElementById("categoriaProduto").value;

        const precosPrato =
            document.getElementById("precosPrato");

        const precoPorcao =
            document.getElementById("precoPorcao");

        const precoBebida =
            document.getElementById("precoBebida");

        precosPrato.style.display = "none";
        precoPorcao.style.display = "none";
        precoBebida.style.display = "none";

        if (categoria === "prato") {

            precosPrato.style.display = "block";

        } else if (categoria === "porcao") {

            precoPorcao.style.display = "block";

        } else if (categoria === "bebida") {

            precoBebida.style.display = "block";

        }
    }

    function abrirNovoProduto() {

        document.getElementById("formularioProduto").style.display = "block";

    }

    function fecharNovoProduto() {

        document.getElementById("formularioProduto").style.display = "none";

    }


    async function salvarProduto() {

        const nome =
            document.getElementById("nomeProduto").value.trim();

        const descricao =
            document.getElementById("descricaoProduto").value.trim();

        const categoria =
            document.getElementById("categoriaProduto").value;

        const status =
            document.getElementById("statusProduto");

        if (!nome) {

            status.textContent =
                "❌ Informe o nome do produto.";

            return;
        }

        let dadosProduto = {
            restaurante_id: 1,
            nome: nome,
            descricao: descricao,
            categoria: categoria,
            preco: 0,
            preco_pequena: null,
            preco_media: null,
            preco_grande: null,
            preco_kg: null,
            foto_base64: null
        };

        

        if (categoria === "prato") {

            dadosProduto.preco_pequena =
                Number(document.getElementById("precoPequena").value);

            dadosProduto.preco_media =
                Number(document.getElementById("precoMedia").value);

            dadosProduto.preco_grande =
                Number(document.getElementById("precoGrande").value);

            dadosProduto.preco =
                dadosProduto.preco_media;

        }

        if (categoria === "porcao") {

            dadosProduto.preco_kg =
                Number(document.getElementById("precoKg").value);

            dadosProduto.preco =
                dadosProduto.preco_kg;

        }

        if (categoria === "bebida") {

            dadosProduto.preco =
                Number(
                    document.getElementById("precoBebidaInput").value
                );

        }

        if (!dadosProduto.preco || dadosProduto.preco <= 0) {

            status.textContent =
                "❌ Informe um preço válido.";

            return;
        }

        let fotoBase64 = null;

        const arquivoFoto =
            document.getElementById("fotoProduto").files[0];

        if (arquivoFoto) {

            fotoBase64 = await new Promise((resolve, reject) => {

                const leitor = new FileReader();

                leitor.onload = () => resolve(leitor.result);

                leitor.onerror = () =>
                    reject(new Error("Erro ao ler a foto."));

                leitor.readAsDataURL(arquivoFoto);
            });
        }

        dadosProduto.foto_base64 = fotoBase64;

        console.log(
            "FOTO BASE64:",
            fotoBase64
        );

        try {

            const resposta = await fetch("/api/pratos", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(dadosProduto)

            });

            const dados = await resposta.json();

            console.log(dados);

            if (!resposta.ok || !dados.sucesso) {

                status.textContent =
                    `❌ ${dados.erro || "Erro ao cadastrar produto."}`;

                return;
            }

            status.textContent =
                "✅ Produto cadastrado com sucesso!";

                await carregarProdutosPainel();

            document.getElementById("nomeProduto").value = "";
            document.getElementById("descricaoProduto").value = "";

            document.getElementById("fotoProduto").value = "";

            document.getElementById("precoPequena").value = "";
            document.getElementById("precoMedia").value = "";
            document.getElementById("precoGrande").value = "";

            document.getElementById("precoKg").value = "";
            document.getElementById("precoBebidaInput").value = "";

        } catch (erro) {

            console.error("Erro ao cadastrar produto:", erro);

            status.textContent =
                "❌ Erro de comunicação com o servidor.";

        }
    }


    async function carregarProdutosPainel() {

        const resposta =
            await fetch("/api/painel/produtos?restaurante=1");

        const dados =
            await resposta.json();

        const container =
            document.getElementById("listaProdutos");

        if (!dados.sucesso || !dados.pratos.length) {

            container.innerHTML =
                "<p>Nenhum produto cadastrado.</p>";

            return;
        }

        const pratos = dados.pratos.filter(
            produto => produto.categoria === "prato"
        );

        const porcoes = dados.pratos.filter(
            produto => produto.categoria === "porcao"
        );

        const bebidas = dados.pratos.filter(
            produto => produto.categoria === "bebida"
        );


        function criarCards(lista) {

            return lista.map(produto => {

                let preco = "";

                if (produto.categoria === "prato") {

                    preco = `
                        <div class="precos-produto">
                            <span>P: R$ ${Number(produto.preco_pequena)
                                .toFixed(2).replace(".", ",")}</span>

                            <span>M: R$ ${Number(produto.preco_media)
                                .toFixed(2).replace(".", ",")}</span>

                            <span>G: R$ ${Number(produto.preco_grande)
                                .toFixed(2).replace(".", ",")}</span>
                        </div>
                    `;

                } else if (produto.categoria === "porcao") {

                    preco = `
                        <strong>
                            R$ ${Number(produto.preco_kg)
                                .toFixed(2).replace(".", ",")} / kg
                        </strong>
                    `;

                } else {

                    preco = `
                        <strong>
                            R$ ${Number(produto.preco)
                                .toFixed(2).replace(".", ",")}
                        </strong>
                    `;
                }

                return `
                    <div class="card-produto-painel">

                        ${produto.foto_base64
                            ? `<img
                                src="${produto.foto_base64}"
                                class="foto-produto-painel"
                                alt="${produto.nome}"
                            >`
                            : ""
                        }

                        <div class="topo-card-produto">

                            <h3>${produto.nome}</h3>

                            <span class="${
                                produto.disponivel
                                    ? "status-disponivel"
                                    : "status-indisponivel"
                            }">

                                ${
                                    produto.disponivel
                                        ? "🟢 Disponível"
                                        : "🔴 Indisponível"
                                }

                            </span>

                        </div>

                        <p class="descricao-produto">
                            ${produto.descricao || ""}
                        </p>

                        ${preco}

                        <div class="acoes-produto">

                            <button
                                onclick="editarProduto(${produto.id})"
                            >
                                ✏️ Editar
                            </button>

                            <button
                                onclick="alterarDisponibilidade(
                                    ${produto.id},
                                    ${!produto.disponivel}
                                )"
                            >
                                ${
                                    produto.disponivel
                                        ? "🔴 Desativar"
                                        : "🟢 Ativar"
                                }
                            </button>
                            <button 
                                onclick="excluirProduto(${produto.id})"
                            >
                                🗑️ Excluir
                            </button>

                        </div>

                    </div>
                `;

            }).join("");
        }


        let html = "";


        if (pratos.length > 0) {

            html += `
                <section class="secao-produtos">

                    <h2>🍽️ Pratos</h2>

                    <div class="grade-produtos-painel">
                        ${criarCards(pratos)}
                    </div>

                </section>
            `;
        }


        if (porcoes.length > 0) {

            html += `
                <section class="secao-produtos">

                    <h2>🥩 Porções</h2>

                    <div class="grade-produtos-painel">
                        ${criarCards(porcoes)}
                    </div>

                </section>
            `;
        }


        if (bebidas.length > 0) {

            html += `
                <section class="secao-produtos">

                    <h2>🥤 Bebidas</h2>

                    <div class="grade-produtos-painel">
                        ${criarCards(bebidas)}
                    </div>

                </section>
            `;
        }


        container.innerHTML = html;
    }


    async function atualizarContadorPedidos() {

        try {

            const resposta =
                await fetch("/api/pedidos?restaurante=1");

            const dados =
                await resposta.json();

            if (!dados.sucesso) {
                return;
            }

            const pedidosNovos =
                dados.pedidos.filter(
                    pedido => pedido.status === "aguardando"
                );

            const contador =
                document.getElementById("contadorPedidos");

            if (!contador) {
                return;
            }

            contador.textContent = pedidosNovos.length;

        } catch (erro) {

            console.error(
                "Erro ao atualizar contador de pedidos:",
                erro
            );
        }
    }


    async function excluirProduto(produtoId) {

    const confirmar =
        confirm("Tem certeza que deseja excluir este produto?");

    if (!confirmar) {
        return;
    }

    try {

        const resposta = await fetch(
            `/api/painel/produtos/${produtoId}`,
            {
                method: "DELETE"
            }
        );

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso) {

            alert(
                dados.erro ||
                "Não foi possível excluir o produto."
            );

            return;
        }

        alert("Produto excluído com sucesso.");

        carregarProdutosPainel();

    } catch (erro) {

        console.error(
            "Erro ao excluir produto:",
            erro
        );

        alert(
            "Erro de comunicação com o servidor."
        );
    }
}


    async function alterarDisponibilidade(id, disponivel) {

        try {

            const resposta = await fetch(
                `/api/pratos/${id}/disponibilidade`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        disponivel: disponivel
                    })
                }
            );

            const dados = await resposta.json();

            console.log(dados);

            if (!resposta.ok || !dados.sucesso) {

                alert(
                    dados.erro ||
                    "Não foi possível alterar a disponibilidade."
                );

                return;
            }

            carregarProdutosPainel();

        } catch (erro) {

            console.error(
                "Erro ao alterar disponibilidade:",
                erro
            );

            alert(
                "Erro de comunicação com o servidor."
            );
        }
    }

    async function editarProduto(id) {

        try {

            const resposta =
                await fetch(`/api/pratos/${id}`);

            const dados =
                await resposta.json();

            if (!resposta.ok || !dados.sucesso) {

                alert(
                    dados.erro ||
                    "Não foi possível carregar o produto."
                );

                return;
            }

            const produto = dados.prato;

            document.getElementById("editarProdutoId").value =
                produto.id;

            document.getElementById("editarNome").value =
                produto.nome || "";

            document.getElementById("editarDescricao").value =
                produto.descricao || "";

            document.getElementById("editarCategoria").value =
                produto.categoria;

            document.getElementById("editarPreco").value =
                produto.preco || "";

            document.getElementById("editarPrecoPequena").value =
                produto.preco_pequena || "";

            document.getElementById("editarPrecoMedia").value =
                produto.preco_media || "";

            document.getElementById("editarPrecoGrande").value =
                produto.preco_grande || "";

            document.getElementById("editarPrecoKg").value =
                produto.preco_kg || "";

            atualizarCamposPrecoEdicao();

            document.getElementById("modalEditarProduto").style.display =
                "flex";

        } catch (erro) {

            console.error(
                "Erro ao carregar produto:",
                erro
            );

            alert(
                "Erro de comunicação com o servidor."
            );
        }
    }


    function atualizarCamposPrecoEdicao() {

        const categoria =
            document.getElementById("editarCategoria").value;

        document.getElementById("camposPrecoPrato").style.display =
            categoria === "prato"
                ? "block"
                : "none";

        document.getElementById("campoPrecoPorcao").style.display =
            categoria === "porcao"
                ? "block"
                : "none";

        document.getElementById("campoPrecoBebida").style.display =
            categoria === "bebida"
                ? "block"
                : "none";
    }


    function fecharModalEditar() {

        document.getElementById("modalEditarProduto").style.display =
            "none";
    }

    async function salvarEdicaoProduto() {

        const id =
            document.getElementById("editarProdutoId").value;

        const categoria =
            document.getElementById("editarCategoria").value;

        const dadosProduto = {
            nome:
                document.getElementById("editarNome").value.trim(),

            descricao:
                document.getElementById("editarDescricao").value.trim(),

            categoria: categoria,

            preco:
                document.getElementById("editarPreco").value || null,

            preco_pequena:
                document.getElementById("editarPrecoPequena").value || null,

            preco_media:
                document.getElementById("editarPrecoMedia").value || null,

            preco_grande:
                document.getElementById("editarPrecoGrande").value || null,

            preco_kg:
                document.getElementById("editarPrecoKg").value || null
        };

        if (!dadosProduto.nome) {

            alert("Informe o nome do produto.");

            return;
        }

        try {

            const resposta = await fetch(
                `/api/pratos/${id}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dadosProduto)
                }
            );

            const dados = await resposta.json();

            console.log(dados);

            if (!resposta.ok || !dados.sucesso) {

                alert(
                    dados.erro ||
                    "Não foi possível atualizar o produto."
                );

                return;
            }

            alert("✅ Produto atualizado com sucesso!");

            fecharModalEditar();

            carregarProdutosPainel();

            

        } catch (erro) {

            console.error(
                "Erro ao salvar produto:",
                erro
            );

            alert(
                "Erro de comunicação com o servidor."
            );
        }
    }

    function abrirPedidos() {
        window.location.href = "/pedidos.html";
    }
    
            atualizarContadorPedidos();

            setInterval(atualizarContadorPedidos, 5000);
    </script>

    <div id="modalEditarProduto" class="modal-editar-produto">

    <div class="conteudo-modal-editar">

        <button
            type="button"
            onclick="fecharModalEditar()"
        >
            ✕
        </button>

        <h2>✏️ Editar produto</h2>

        <input type="hidden" id="editarProdutoId">

        <label>
            Nome
            <input type="text" id="editarNome">
        </label>

        <br><br>

        <label>
            Descrição
            <textarea
                id="editarDescricao"
                rows="3"
            ></textarea>
        </label>

        <br><br>

        <label>
            Categoria
            <select
                id="editarCategoria"
                onchange="atualizarCamposPrecoEdicao()"
            >
                <option value="prato">🍽️ Prato</option>
                <option value="porcao">🥩 Porção</option>
                <option value="bebida">🥤 Bebida</option>
            </select>
        </label>

        <div id="camposPrecoPrato">

            <h3>Preços</h3>

            <label>
                Pequena
                <input
                    type="number"
                    step="0.01"
                    id="editarPrecoPequena"
                >
            </label>

            <br><br>

            <label>
                Média
                <input
                    type="number"
                    step="0.01"
                    id="editarPrecoMedia"
                >
            </label>

            <br><br>

            <label>
                Grande
                <input
                    type="number"
                    step="0.01"
                    id="editarPrecoGrande"
                >
            </label>

        </div>

        <div id="campoPrecoPorcao">

            <h3>Preço por kg</h3>

            <input
                type="number"
                step="0.01"
                id="editarPrecoKg"
            >

        </div>

        <div id="campoPrecoBebida">

            <h3>Preço</h3>

            <input
                type="number"
                step="0.01"
                id="editarPreco"
            >

        </div>

        <br>

        <button
            type="button"
            onclick="salvarEdicaoProduto()"
        >
            💾 Salvar alterações
        </button>

    </div>

</div>

</body>
</html>
