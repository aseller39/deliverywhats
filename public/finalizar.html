<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finalizar pedido</title>

    <style>

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;

        margin: 0;

        padding: 25px 15px;

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #172033
            );

        color: #ffffff;
    }

    body > h1 {
        max-width: 700px;

        margin: 10px auto 30px;

        text-align: center;

        font-size: 30px;
    }

    body > h2,
    body > hr,
    body > label,
    body > input,
    body > textarea,
    body > button {
        max-width: 700px;
    }

    #resumoPedido {
        max-width: 700px;

        margin: 0 auto;
    }

    #resumoPedido > div {
        background: #1e293b;

        border: 1px solid #334155;

        border-radius: 14px;

        padding: 16px 18px;

        margin-bottom: 12px;

        box-shadow:
            0 5px 15px rgba(0, 0, 0, 0.25);
    }

    #resumoPedido h3 {
        margin: 0 0 8px;

        color: #ffffff;
    }

    #resumoPedido p {
        margin: 5px 0;

        color: #cbd5e1;
    }

    #resumoPedido strong {
        display: block;

        margin-top: 10px;

        color: #86efac;

        font-size: 19px;
    }

    #taxaEntregaResumo {
        text-align: right;
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
    }

    body > h2 {
        margin: 25px auto 12px;
    }

    body > hr {
        margin: 25px auto;

        border: none;

        border-top: 1px solid #334155;
    }

    input[type="text"],
    input[type="tel"],
    textarea {
        display: block;

        width: 100%;

        max-width: 700px;

        margin: 8px auto;

        padding: 13px 14px;

        border: 1px solid #475569;

        border-radius: 10px;

        background: #1e293b;

        color: #ffffff;

        font-size: 16px;

        outline: none;
    }

    input::placeholder,
    textarea::placeholder {
        color: #94a3b8;
    }

    input:focus,
    textarea:focus {
        border-color: #64748b;
    }

    textarea {
        min-height: 110px;

        resize: vertical;
    }

    .opcoes-entrega {
    max-width: 700px;

    margin: 0 auto;

    display: flex;

    gap: 12px;
}

.opcao-entrega {
    flex: 1;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 15px;

    background: #1e293b;

    border: 2px solid #334155;

    border-radius: 14px;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease;
}

.opcao-entrega:has(input:checked) {
    border-color: #22c55e;

    background: #172d24;
}

.opcao-entrega input {
    width: 20px;

    height: 20px;

    accent-color: #22c55e;

    flex-shrink: 0;
}

.opcao-entrega span {
    display: flex;

    flex-direction: column;

    gap: 4px;

    color: #ffffff;

    font-size: 22px;
}

.opcao-entrega strong {
    font-size: 16px;
}

.opcao-entrega small {
    color: #94a3b8;

    font-size: 13px;
}

.dados-entrega {
    max-width: 700px;

    margin: 20px auto;

    padding: 20px;

    background: #1e293b;

    border: 1px solid #334155;

    border-radius: 14px;

    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.25);
}

.dados-entrega h3 {
    margin-top: 0;

    margin-bottom: 18px;

    color: #ffffff;
}

.dados-entrega input {
    margin: 10px 0;
}

.opcoes-pagamento {
    max-width: 700px;

    margin: 0 auto;

    display: flex;

    gap: 12px;
}

.opcao-pagamento {
    flex: 1;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 15px;

    background: #1e293b;

    border: 2px solid #334155;

    border-radius: 14px;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease;
}

.opcao-pagamento:has(input:checked) {
    border-color: #22c55e;

    background: #172d24;
}

.opcao-pagamento input {
    width: 19px;

    height: 19px;

    accent-color: #22c55e;

    flex-shrink: 0;
}

.opcao-pagamento span {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #ffffff;

    font-size: 20px;
}

.opcao-pagamento strong {
    font-size: 15px;
}

.acoes-finalizar {
    max-width: 700px;

    margin: 25px auto 10px;

    display: flex;

    gap: 12px;
}

.acoes-finalizar button {
    flex: 1;

    padding: 16px;

    border: none;

    border-radius: 12px;

    color: #ffffff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        filter 0.2s ease;
}

.botao-voltar {
    background: #334155;
}

.botao-enviar {
    background: #16a34a;

    box-shadow:
        0 6px 18px rgba(22, 163, 74, 0.3);
}

.acoes-finalizar button:hover {
    transform: translateY(-2px);

    filter: brightness(1.1);
}


@media (max-width: 600px) {

    body {
        padding: 18px 12px;
    }

    body > h1 {
        font-size: 26px;
    }

    .opcoes-entrega,
    .opcoes-pagamento {
        flex-direction: column;
    }

    .opcao-entrega,
    .opcao-pagamento {
        width: 100%;
    }

    .dados-entrega {
        padding: 16px;
    }

    .acoes-finalizar {
        flex-direction: column;

        gap: 10px;
    }

    .acoes-finalizar button {
        width: 100%;

        padding: 16px;
    }

}


</style>

</head>

<body>

    <h1>Finalizar pedido</h1>


    <hr>

    <h2>Como deseja receber?</h2>

    <div class="opcoes-entrega">

    <label class="opcao-entrega">

        <input
            type="radio"
            name="tipoEntrega"
            value="retirada"
            checked
        >

        <span>
            🏪
            <strong>Retirar no local</strong>
            <small>Vou buscar meu pedido</small>
        </span>

    </label>


    <label class="opcao-entrega">

        <input
            type="radio"
            name="tipoEntrega"
            value="entrega"
        >

        <span>
            🛵
            <strong>Entrega</strong>
            <small>Receber no meu endereço</small>
        </span>

    </label>

</div>

    <div id="dadosEntrega" class="dados-entrega" style="display: none;">

        <h3>Endereço de entrega</h3>

        <input
            type="text"
            id="rua"
            placeholder="Rua ou Avenida"
        >

        <br><br>

        <input
            type="text"
            id="numero"
            placeholder="Número"
        >

        <br><br>

        <input
            type="text"
            id="bairro"
            placeholder="Bairro"
        >

        <br><br>

        <input
            type="text"
            id="complemento"
            placeholder="Complemento"
        >

        <br><br>

        <input
            type="text"
            id="referencia"
            placeholder="Ponto de referência"
        >
        
        <div id="taxaEntrega" style="margin-top: 15px; font-weight: bold;">
        </div>

    </div>

    <script>
        const enderecoSalvo = JSON.parse(
            localStorage.getItem("enderecoCliente") || "null"
        );

        if (enderecoSalvo) {
            document.getElementById("rua").value =
                enderecoSalvo.rua || "";

            document.getElementById("numero").value =
                enderecoSalvo.numero || "";

            document.getElementById("bairro").value =
                enderecoSalvo.bairro || "";

            document.getElementById("complemento").value =
                enderecoSalvo.complemento || "";

            document.getElementById("referencia").value =
                enderecoSalvo.referencia || "";
        }


        let taxaEntregaAtual = 0;
        let totalPedidoAtual = 0;

        async function consultarTaxaEntrega() {

            const rua =
                document.getElementById("rua").value.trim();

            const numero =
                document.getElementById("numero").value.trim();

            const bairro =
                document.getElementById("bairro").value.trim();

            if (!rua || !numero || !bairro) {
                return;
            }

            const endereco =
                `${rua}, ${numero}, ${bairro}, Paraná, Brasil`;

            try {

                const resposta = await fetch(
                    `/teste-endereco?endereco=${encodeURIComponent(endereco)}`
                );

                const dados = await resposta.json();

                console.log(
                    "🔎 CONSULTA TAXA:",
                    dados
                );

                if (dados.taxaEntrega) {

                    taxaEntregaAtual =
                        Number(dados.taxaEntrega.taxa);

                    const totalAtualizado =
                        totalPedidoAtual + taxaEntregaAtual;

                    document.getElementById("totalPedido")
                        .textContent =
                            totalAtualizado.toFixed(2)
                                .replace(".", ",");

                    document.getElementById("taxaEntrega").textContent =
                        `🛵 Taxa de entrega: R$ ${Number(dados.taxaEntrega.taxa)
                            .toFixed(2)
                            .replace(".", ",")}`;

                    document.getElementById("taxaEntregaResumo")
                        .textContent =
                            `Taxa de entrega: R$ ${taxaEntregaAtual.toFixed(2).replace(".", ",")}`;
                    
                    carregarResumo();

                }

            } catch (erro) {

                console.error(
                    "Erro ao consultar taxa:",
                    erro
                );

            }
        }

        document.getElementById("bairro").addEventListener("blur", consultarTaxaEntrega);

        if (
            enderecoSalvo &&
            document.querySelector('input[name="tipoEntrega"]:checked').value === "entrega"
        ) {
            consultarTaxaEntrega();
        }

    </script>

    <h2>Nome</h2>

    <input
        type="text"
        id="nomeCliente"
        placeholder="Digite seu nome"
    >

    <h2>Telefone</h2>

    <input
        type="tel"
        id="telefone"
        placeholder="Digite seu telefone"
    >

    <script>
        const nomeSalvo = localStorage.getItem("nomeCliente");
        const telefoneSalvo = localStorage.getItem("telefoneCliente");

        if (nomeSalvo) {
            document.getElementById("nomeCliente").value = nomeSalvo;
        }

        if (telefoneSalvo) {
            document.getElementById("telefone").value = telefoneSalvo;
        }
    </script>

    <h2>Forma de pagamento</h2>

    <div class="opcoes-pagamento">

    <label class="opcao-pagamento">

        <input
            type="radio"
            name="pagamento"
            value="pix"
            checked
        >

        <span>
            💠
            <strong>Pix</strong>
        </span>

    </label>


    <label class="opcao-pagamento">

        <input
            type="radio"
            name="pagamento"
            value="dinheiro"
        >

        <span>
            💵
            <strong>Dinheiro</strong>
        </span>

    </label>


    <label class="opcao-pagamento">

        <input
            type="radio"
            name="pagamento"
            value="cartao"
        >

        <span>
            💳
            <strong>Cartão</strong>
        </span>

    </label>

</div>

    <h2>Observação</h2>

    <textarea
        id="observacao"
        placeholder="Alguma observação sobre o pedido?"
    ></textarea>

    <br>
    <div id="resumoPedido"></div>

    <div id="taxaEntregaResumo"></div>

    <h2>
        Total: R$
        <span id="totalPedido">0,00</span>
    </h2>

    <br>

    <div class="acoes-finalizar">

    <button
        class="botao-voltar"
        onclick="voltarCarrinho()"
    >
        ← Voltar ao carrinho
    </button>

    <button
        class="botao-enviar"
        onclick="enviarPedido()"
    >
        ✅ Enviar pedido
    </button>

</div>


    <script>

        let carrinho = [];

        const carrinhoSalvo =
            localStorage.getItem("carrinho");

        if (carrinhoSalvo) {
            carrinho = JSON.parse(carrinhoSalvo);
        }


function carregarResumo() {

    const container =
        document.getElementById("resumoPedido");

    let total = 0;

    container.innerHTML =
        carrinho.map(item => {

            total += Number(item.subtotal);

            let descricao = "";

            if (item.tipo === "porcao") {

                descricao =
                    item.gramas === 1000
                        ? "1 kg"
                        : `${item.gramas} g`;

            } else if (item.tamanho) {

                descricao = item.tamanho;
            }

            return `
                <div>

                    <h3>${item.nome}</h3>

                    ${
                        descricao
                            ? `<p>${descricao}</p>`
                            : ""
                    }

                    <p>
                        Quantidade:
                        ${item.quantidade}
                    </p>

                    <strong>
                        R$
                        ${Number(item.subtotal)
                            .toFixed(2)
                            .replace(".", ",")}
                        
                    </strong>

                </div>
            `;

        }).join("");
    totalPedidoAtual = total;

    console.log("💰 TAXA USADA NO TOTAL:", taxaEntregaAtual);

    const totalComEntrega =
        total + taxaEntregaAtual;

    document.getElementById("totalPedido")
        .textContent =
            totalComEntrega.toFixed(2)
                .replace(".", ",");

    document.getElementById("taxaEntregaResumo")
        .textContent =
            taxaEntregaAtual > 0
                ? `Taxa de entrega: R$ ${taxaEntregaAtual.toFixed(2).replace(".", ",")}`
                : "";
}


document
    .querySelectorAll('input[name="tipoEntrega"]')
    .forEach(input => {

        input.addEventListener("change", () => {

            const entrega =
                document.querySelector(
                    'input[name="tipoEntrega"]:checked'
                ).value;

            if (entrega === "retirada") {
                taxaEntregaAtual = 0;
                carregarResumo();
            } else {
                consultarTaxaEntrega();
            }

            document.getElementById("dadosEntrega")
                .style.display =
                    entrega === "entrega"
                        ? "block"
                        : "none";
        });

    });


        function voltarCarrinho() {

            const parametros =
                new URLSearchParams(window.location.search);

            const restauranteId =
                parametros.get("restaurante");

            window.location.href =
                `/carrinho.html?restaurante=${restauranteId}`;
        }


    async function enviarPedido() {

        if (carrinho.length === 0) {
            alert("Seu carrinho está vazio.");
            return;
        }

        const parametros =
            new URLSearchParams(window.location.search);

        const restauranteId =
            parametros.get("restaurante");

        const tipoEntrega =
            document.querySelector(
                'input[name="tipoEntrega"]:checked'
            ).value;

        const pagamento =
            document.querySelector(
                'input[name="pagamento"]:checked'
            ).value;
        
        const telefone =
            document.getElementById("telefone").value
                .replace(/\D/g, "");

        if (telefone.length < 10 || telefone.length > 11) {
            alert("Digite um telefone válido com DDD.");
            return;
        }

        const endereco = tipoEntrega === "entrega"
            ? [
                document.getElementById("rua").value,
                document.getElementById("numero").value,
                document.getElementById("bairro").value,
                document.getElementById("complemento").value,
                document.getElementById("referencia").value
            ].filter(Boolean).join(", ")
            : null;

        let total = 0;

        carrinho.forEach(item => {
            total += Number(item.subtotal);
        });

        const pedido = {

            restaurante_id: Number(restauranteId),

            itens: carrinho,

            observacao:
                document.getElementById("observacao").value,

            nome:
                document.getElementById("nomeCliente").value,


            telefone:
                "55" + telefone,

            tipo_entrega: tipoEntrega,

            endereco: tipoEntrega === "entrega"
                ? {
                    rua: document.getElementById("rua").value,
                    numero: document.getElementById("numero").value,
                    bairro: document.getElementById("bairro").value,
                    complemento: document.getElementById("complemento").value,
                    referencia: document.getElementById("referencia").value
                }
                : null,

            forma_pagamento: pagamento,

            total: totalPedidoAtual + taxaEntregaAtual

        };
        console.log("ENVIANDO PEDIDO:", pedido);

        try {

            const resposta = await fetch("/api/pedidos", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(pedido)

            });

            const dados = await resposta.json();

            console.log("RESPOSTA DO SERVIDOR:", dados);

            if (!resposta.ok) {

                alert(
                    dados.erro ||
                    "Não foi possível enviar o pedido."
                );

                return;
            }

            localStorage.setItem(
                "nomeCliente",
                document.getElementById("nomeCliente").value.trim()
            );

            localStorage.setItem(
                "telefoneCliente",
                document.getElementById("telefone").value.trim()
            );

            if (tipoEntrega === "entrega") {
                const enderecoCliente = {
                    rua: document.getElementById("rua").value.trim(),
                    numero: document.getElementById("numero").value.trim(),
                    bairro: document.getElementById("bairro").value.trim(),
                    complemento: document.getElementById("complemento").value.trim(),
                    referencia: document.getElementById("referencia").value.trim()
                };

                localStorage.setItem(
                    "enderecoCliente",
                    JSON.stringify(enderecoCliente)
                );
            }

            alert(
                "ID DO PEDIDO: " +
                dados.pedido.id
            );

            const pedidosAcompanhamento =
                JSON.parse(
                    localStorage.getItem("pedidosAcompanhamento") || "[]"
                );

            pedidosAcompanhamento.push(dados.pedido.id);

            localStorage.setItem(
                "pedidosAcompanhamento",
                JSON.stringify(pedidosAcompanhamento)
            );

            alert("Pedido enviado com sucesso!");

            localStorage.removeItem("carrinho");

            window.location.href =
                `/acompanhamento.html?restaurante=${restauranteId}`;

        } catch (erro) {

            console.error(
                "Erro ao enviar pedido:",
                erro
            );

            alert(
                "Não foi possível enviar o pedido. Tente novamente."
            );
        }
    }


        carregarResumo();

    </script>

</body>

</html>
