<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Gustum</title>
</head>
    <body>

    <header>
        <h1>🍽️ Gustum</h1>
        <p>Cardápio de hoje</p>
    </header>

    <main id="cardapio">

        <div id="avisos"></div>

    </main>

        <script>

            carregarCardapio();
            carregarAvisos();

            async function carregarCardapio() {
                const parametros = new URLSearchParams(window.location.search);
                const restauranteId = parametros.get("restaurante");

                const resposta = await fetch(`/api/cardapio?restaurante=${restauranteId}`);
                const dados = await resposta.json();
                const container = document.getElementById("cardapio");

            container.innerHTML = dados.pratos.map(prato => `
                <div>
                <h2>${prato.nome}</h2>
                <p>${prato.descricao}</p>
                <strong>R$ ${Number(prato.preco).toFixed(2).replace(".", ",")}</strong>
                <button>Adicionar ao pedido</button>
                </div>
            `).join("");
            }

            async function carregarAvisos() {
                const resposta = await fetch("/api/avisos?restaurante=1");
                const dados = await resposta.json();

                const container = document.getElementById("avisos");

                container.innerHTML = dados.avisos.map(aviso => `
                    <div>
                    <h2>📢 ${aviso.titulo}</h2>
                    <p>${aviso.mensagem}</p>
                    </div>
                `).join("");
            }


            
        </script>

    </body>
</html>
