<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Gustum</title>

    <style>
        .card-produto {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            width: 220px;
        }

        .card-produto h2 {
            margin: 0 0 8px;
        }

        .card-produto p {
            margin: 0 0 10px;
        }

        .card-produto strong {
            display: block;
            font-size: 18px;
        }

        #pratos {
            width: 100%;
        }

        .grade-produtos {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
        }

        .modal-produto {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .conteudo-modal-produto {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 20px;
            position: relative;
        }

        .conteudo-modal-produto > button {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
        }

    </style>

</head>
    <body>

    <header>
        <h1>🍽️ Gustum</h1>
        <p>Cardápio de hoje</p>
        <button id="botaoCarrinho" onclick="abrirCarrinho()">
            🛒 <span id="quantidadeCarrinho">0</span>
        </button>
    </header>

    <main id="cardapio">

        <div id="avisos"></div>

        <div id="pratos"></div>

        <div id="pedido"></div>

    </main>

        <div id="modalProduto" class="modal-produto">
            <div class="conteudo-modal-produto">

                <button onclick="fecharProduto()">✕</button>

                <div id="detalhesProduto"></div>

            </div>
        </div>


        <script>
            let itensPedido = [];
            let pratosDisponiveis = [];
            let produtoSelecionadoId = null;
            let carrinho = [];
            const carrinhoSalvo = localStorage.getItem("carrinho");

            if (carrinhoSalvo) {
                carrinho = JSON.parse(carrinhoSalvo);
            }

            let observacaoPedido = "";
            const itensSalvos = localStorage.getItem("itensPedido");
            const observacaoSalva = localStorage.getItem("observacaoPedido");

            if (itensSalvos) {
                itensPedido = JSON.parse(itensSalvos);
            }

            if (observacaoSalva) {
                observacaoPedido = observacaoSalva;
            }

            

            async function carregarCardapio() {
                const parametros = new URLSearchParams(window.location.search);
                const restauranteId = parametros.get("restaurante");

                const resposta = await fetch(`/api/cardapio?restaurante=${restauranteId}`);
                const dados = await resposta.json();
                pratosDisponiveis = dados.pratos;
                const container = document.getElementById("pratos");

            const pratos = dados.pratos.filter(prato =>
                prato.categoria === "prato"
            );

            const porcoes = dados.pratos.filter(prato =>
                prato.categoria === "porcao"
            );

            const bebidas = dados.pratos.filter(prato =>
                prato.categoria === "bebida"
            );

            container.innerHTML = `

                ${
                    pratos.length > 0
                        ? `
                            <h2 class="titulo-categoria">
                                🍽️ Pratos
                            </h2>

                            <div class="grade-produtos">

                                ${
                                    pratos.map(prato => `
                                        <div
                                            class="card-produto"
                                            onclick="abrirProduto(${prato.id})"
                                        >

                                            <h2>${prato.nome}</h2>

                                            <p>
                                                ${prato.descricao || ""}
                                            </p>

                                            <strong>
                                                R$ ${
                                                    Number(prato.preco)
                                                        .toFixed(2)
                                                        .replace(".", ",")
                                                }
                                            </strong>

                                        </div>
                                    `).join("")
                                }

                            </div>
                        `
                        : ""
                }


                ${
                    porcoes.length > 0
                        ? `
                            <h2 class="titulo-categoria">
                                🥩 Porções
                            </h2>

                            <div class="grade-produtos">

                                ${
                                    porcoes.map(porcao => `
                                        <div
                                            class="card-produto"
                                            onclick="abrirProduto(${porcao.id})"
                                        >

                                            <h2>${porcao.nome}</h2>

                                            <p>
                                                ${porcao.descricao || ""}
                                            </p>

                                            <strong>
                                                R$ ${
                                                    Number(porcao.preco_kg)
                                                        .toFixed(2)
                                                        .replace(".", ",")
                                                } / kg
                                            </strong>

                                        </div>
                                    `).join("")
                                }

                            </div>
                        `
                        : ""
                }


                ${
                    bebidas.length > 0
                        ? `
                            <h2 class="titulo-categoria">
                                🥤 Bebidas
                            </h2>

                            <div class="grade-produtos">

                                ${
                                    bebidas.map(bebida => `
                                        <div
                                            class="card-produto"
                                            onclick="abrirProduto(${bebida.id})"
                                        >

                                            <h2>${bebida.nome}</h2>

                                            <p>
                                                ${bebida.descricao || ""}
                                            </p>

                                            <strong>
                                                R$ ${
                                                    Number(bebida.preco)
                                                        .toFixed(2)
                                                        .replace(".", ",")
                                                }
                                            </strong>

                                        </div>
                                    `).join("")
                                }

                            </div>
                        `
                        : ""
                }

            `;
            }


            function abrirProduto(id) {
                const produto = pratosDisponiveis.find(p => p.id === id);

                if (!produto) {
                    return;
                }
                produtoSelecionadoId = id;

                const detalhes = document.getElementById("detalhesProduto");

                if (produto.categoria === "prato" && produto.preco_pequena) {

                    detalhes.innerHTML = `
                        <h2>${produto.nome}</h2>
                        <p>${produto.descricao}</p>

                        <h3>Tamanho</h3>

                        <label>
                            <input type="radio" name="tamanhoProduto" value="pequena" checked>
                            Pequena — R$ ${Number(produto.preco_pequena).toFixed(2).replace(".", ",")}
                        </label>

                        <br>

                        <label>
                            <input type="radio" name="tamanhoProduto" value="media">
                            Média — R$ ${Number(produto.preco_media).toFixed(2).replace(".", ",")}
                        </label>

                        <br>

                        <label>
                            <input type="radio" name="tamanhoProduto" value="grande">
                            Grande — R$ ${Number(produto.preco_grande).toFixed(2).replace(".", ",")}
                        </label>

                        <h3>Quantidade</h3>

                        <div>
                            <button onclick="alterarQuantidadeProduto(-1)">−</button>
                            <span id="quantidadeProduto">1</span>
                            <button onclick="alterarQuantidadeProduto(1)">+</button>
                        </div>

                        <h3>
                            Total:
                            R$ <span id="totalProduto">
                                ${Number(produto.preco_pequena).toFixed(2).replace(".", ",")}
                            </span>
                        </h3>

                        <button onclick="adicionarProdutoCarrinho(${produto.id})">
                            🛒 Adicionar ao carrinho
                        </button>
                    `;

                    document
                        .querySelectorAll('input[name="tamanhoProduto"]')
                        .forEach(radio => {
                            radio.addEventListener("change", () => {
                                atualizarTotalProduto(produto);
                            });
                        });

                    } else if (produto.categoria === "porcao") {

                        detalhes.innerHTML = `
                            <h2>${produto.nome}</h2>
                            <p>${produto.descricao}</p>

                            <h3>
                                R$ ${Number(produto.preco_kg).toFixed(2).replace(".", ",")} / kg
                            </h3>

                            <h3>Quantidade</h3>

                            <div>
                                <button onclick="alterarQuantidadePorcao(-100)">−</button>
                                <span id="quantidadePorcao">100 g</span>
                                <button onclick="alterarQuantidadePorcao(100)">+</button>
                            </div>

                            <h3>
                                Total:
                                R$ <span id="totalProduto">
                                    ${(Number(produto.preco_kg) / 10).toFixed(2).replace(".", ",")}
                                </span>
                            </h3>

                            <button onclick="adicionarPorcaoCarrinho(${produto.id})">
                                🛒 Adicionar ao carrinho
                            </button>
                        `;

                    } else {

                        detalhes.innerHTML = `
                            <h2>${produto.nome}</h2>
                            <p>${produto.descricao}</p>

                            <h3>
                                R$ ${Number(produto.preco).toFixed(2).replace(".", ",")}
                            </h3>

                            <h3>Quantidade</h3>

                            <div>
                                <button onclick="alterarQuantidadeProduto(-1)">−</button>
                                <span id="quantidadeProduto">1</span>
                                <button onclick="alterarQuantidadeProduto(1)">+</button>
                            </div>

                            <h3>
                                Total:
                                R$ <span id="totalProduto">
                                    ${Number(produto.preco).toFixed(2).replace(".", ",")}
                                </span>
                            </h3>

                            <button onclick="adicionarProdutoCarrinho(${produto.id})">
                                🛒 Adicionar ao carrinho
                            </button>
                        `;

                    }

                document.getElementById("modalProduto").style.display = "flex";
            }

            function alterarQuantidadeProduto(valor) {
                const elemento = document.getElementById("quantidadeProduto");

                let quantidade = Number(elemento.textContent);

                quantidade += valor;

                if (quantidade < 1) {
                    quantidade = 1;
                }

                elemento.textContent = quantidade;

                const produto = pratosDisponiveis.find(
                    p => p.id === produtoSelecionadoId
                );

                if (produto) {
                    atualizarTotalProduto(produto);
                }
            }


            function alterarQuantidadePorcao(valor) {
                const elemento = document.getElementById("quantidadePorcao");

                let gramas = parseInt(elemento.textContent);

                gramas += valor;

                if (gramas < 100) {
                    gramas = 100;
                }

                if (gramas > 1000) {
                    gramas = 1000;
                }

                elemento.textContent =
                    gramas >= 1000
                        ? "1 kg"
                        : `${gramas} g`;

                const produto = pratosDisponiveis.find(
                    p => p.id === produtoSelecionadoId
                );

                if (produto) {
                    atualizarTotalPorcao(produto, gramas);
                }
            }

            function atualizarTotalPorcao(produto, gramas) {
                const precoKg = Number(produto.preco_kg);

                const total = precoKg * (gramas / 1000);

                document.getElementById("totalProduto").textContent =
                    total.toFixed(2).replace(".", ",");
            }


            function adicionarPorcaoCarrinho(id) {
                const produto = pratosDisponiveis.find(p => p.id === id);

                if (!produto) {
                    return;
                }

                const textoQuantidade =
                    document.getElementById("quantidadePorcao").textContent;

                const gramas =
                    textoQuantidade === "1 kg"
                        ? 1000
                        : parseInt(textoQuantidade);

                const precoKg = Number(produto.preco_kg);

                const subtotal = precoKg * (gramas / 1000);

                const item = {
                    id: produto.id,
                    nome: produto.nome,
                    tipo: "porcao",
                    gramas: gramas,
                    preco_kg: precoKg,
                    quantidade: 1,
                    subtotal: subtotal
                };

                carrinho.push(item);
                localStorage.setItem("carrinho", JSON.stringify(carrinho));

                console.log("CARRINHO:", carrinho);

                fecharProduto();
            }


            function atualizarTotalProduto(produto) {
                const quantidade = Number(
                    document.getElementById("quantidadeProduto").textContent
                );

                let preco = Number(produto.preco);

                const tamanho = document.querySelector(
                    'input[name="tamanhoProduto"]:checked'
                );

                if (tamanho) {
                    if (tamanho.value === "pequena") {
                        preco = Number(produto.preco_pequena);
                    }

                    if (tamanho.value === "media") {
                        preco = Number(produto.preco_media);
                    }

                    if (tamanho.value === "grande") {
                        preco = Number(produto.preco_grande);
                    }
                }

                const total = preco * quantidade;

                document.getElementById("totalProduto").textContent =
                    total.toFixed(2).replace(".", ",");
            }

            function adicionarProdutoCarrinho(id) {
                const produto = pratosDisponiveis.find(p => p.id === id);

                if (!produto) {
                    return;
                }

                const quantidade = Number(
                    document.getElementById("quantidadeProduto").textContent
                );

                let tamanho = null;
                let preco = Number(produto.preco);

                const tamanhoSelecionado = document.querySelector(
                    'input[name="tamanhoProduto"]:checked'
                );

                if (tamanhoSelecionado) {
                    tamanho = tamanhoSelecionado.value;

                    if (tamanho === "pequena") {
                        preco = Number(produto.preco_pequena);
                    }

                    if (tamanho === "media") {
                        preco = Number(produto.preco_media);
                    }

                    if (tamanho === "grande") {
                        preco = Number(produto.preco_grande);
                    }
                }

                const item = {
                    id: produto.id,
                    nome: produto.nome,
                    tamanho: tamanho,
                    preco: preco,
                    quantidade: quantidade,
                    subtotal: preco * quantidade
                };

                carrinho.push(item);
                localStorage.setItem("carrinho", JSON.stringify(carrinho));

                console.log("CARRINHO:", carrinho);

                fecharProduto();
            }


            function fecharProduto() {
                document.getElementById("modalProduto").style.display = "none";
            }

            function abrirCarrinho() {
                const parametros =
                    new URLSearchParams(window.location.search);

                const restauranteId =
                    parametros.get("restaurante");

                window.location.href =
                    `/carrinho.html?restaurante=${restauranteId}`;
            }


            function fecharCarrinho() {
                document.getElementById("modalCarrinho").style.display = "none";
            }
                        

            function adicionarAoPedido(pratoId) {
                const prato = pratosDisponiveis.find(p => p.id === pratoId);

                if (!prato) {
                    return;
                }

                const itemExistente = itensPedido.find(item => item.id === prato.id);

                if (itemExistente) {
                    itemExistente.quantidade++;
                } else {
                    itensPedido.push({
                        id: prato.id,
                        nome: prato.nome,
                        preco: Number(prato.preco),
                        quantidade: 1
                    });
                }

                
            }
            atualizarIconeCarrinho();

            function alterarQuantidade(pratoId, valor) {
                const item = itensPedido.find(item => item.id === pratoId);

                if (!item) {
                    return;
                }

                item.quantidade += valor;

                if (item.quantidade <= 0) {
                    itensPedido = itensPedido.filter(item => item.id !== pratoId);
                }

                
            }



            function mostrarEndereco() {
                const entregaSelecionada =
                    document.querySelector('input[name="tipoEntrega"]:checked')?.value === "entrega";

                const endereco = document.getElementById("enderecoEntrega");

                endereco.style.display = entregaSelecionada ? "block" : "none";
            }


            function limparCarrinho() {
                itensPedido = [];
                observacaoPedido = "";

                localStorage.removeItem("itensPedido");
                localStorage.removeItem("observacaoPedido");

                document.getElementById("pedido").innerHTML = "";
            }


            async function carregarAvisos() {
                const parametros = new URLSearchParams(window.location.search);
                const restauranteId = parametros.get("restaurante");

                const resposta = await fetch(`/api/avisos?restaurante=${restauranteId}`);
                const dados = await resposta.json();

                const container = document.getElementById("avisos");

                container.innerHTML = dados.avisos.map(aviso => `
                    <div>
                        <h2>📢 ${aviso.titulo}</h2>
                        <p>${aviso.mensagem}</p>
                    </div>
                `).join("");
            }

            carregarCardapio();
            carregarAvisos();
            



            async function enviarPedido() {
                if (itensPedido.length === 0) {
                    alert("Adicione pelo menos um item ao pedido.");
                    return;
                }

                const telefone = document.getElementById("telefonePedido")?.value.trim();

                if (!telefone) {
                    alert("Informe seu telefone.");
                    return;
                }

                const tipoEntrega =
                    document.querySelector('input[name="tipoEntrega"]:checked')?.value;

                if (!tipoEntrega) {
                    alert("Escolha como deseja receber o pedido.");
                    return;
                }

                const endereco =
                    document.getElementById("enderecoPedido")?.value.trim();

                if (tipoEntrega === "entrega" && !endereco) {
                    alert("Informe o endereço de entrega.");
                    return;
                }

                const formaPagamento =
                    document.querySelector('input[name="formaPagamento"]:checked')?.value;

                if (!formaPagamento) {
                    alert("Escolha a forma de pagamento.");
                    return;
                }

                const campoObservacao = document.getElementById("observacaoPedido");

                if (campoObservacao) {
                    observacaoPedido = campoObservacao.value.trim();
                }

                const total = itensPedido.reduce(
                    (soma, item) => soma + (item.preco * item.quantidade),
                    0
                );

                const pedidoFinal = {
                    restaurante_id: 1,
                    itens: itensPedido,
                    observacao: observacaoPedido,
                    telefone: telefone,
                    tipo_entrega: tipoEntrega,
                    endereco: tipoEntrega === "entrega" ? endereco : null,
                    forma_pagamento: formaPagamento,
                    total: total
                };

                const resposta = await fetch("/api/pedidos", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(pedidoFinal)
                });

                const dados = await resposta.json();

                console.log("RESPOSTA DO PEDIDO:", dados);

                if (dados.sucesso) {
                    alert(
                        `✅ Pedido #${dados.pedido.id} enviado com sucesso!\n\n` +
                        `O restaurante recebeu seu pedido.`
                    );

                    limparCarrinho();
                }
            }

            function atualizarIconeCarrinho() {
                const quantidade = itensPedido.reduce(
                    (total, item) => total + item.quantidade,
                    0
                );

                document.getElementById("quantidadeCarrinho").textContent = quantidade;
            }

            carregarCardapio();
        </script>


    </body>
</html>
