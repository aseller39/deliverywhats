<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Gustum</title>
</head>
    <body>

    <header>
        <h1>🍽️ Gustum</h1>
        <p>Cardápio de hoje</p>
    </header>

    <main id="cardapio">

        <div id="avisos"></div>

        <div id="pratos"></div>

        <div id="pedido"></div>

    </main>

        <script>
            let itensPedido = [];
            let observacaoPedido = "";
            let pratosDisponiveis = [];

            

            async function carregarCardapio() {
                const parametros = new URLSearchParams(window.location.search);
                const restauranteId = parametros.get("restaurante");

                const resposta = await fetch(`/api/cardapio?restaurante=${restauranteId}`);
                const dados = await resposta.json();
                pratosDisponiveis = dados.pratos;
                const container = document.getElementById("pratos");

            container.innerHTML = dados.pratos.map(prato => `
                <div>
                <h2>${prato.nome}</h2>
                <p>${prato.descricao}</p>
                <strong>R$ ${Number(prato.preco).toFixed(2).replace(".", ",")}</strong>
                <button onclick="adicionarAoPedido(${prato.id})">
                    Adicionar ao pedido
                </button>
                </div>
            `).join("");
            }

            

            function adicionarAoPedido(pratoId) {
                const prato = pratosDisponiveis.find(p => p.id === pratoId);

                if (!prato) {
                    return;
                }

                const itemExistente = itensPedido.find(item => item.id === prato.id);

                if (itemExistente) {
                    itemExistente.quantidade++;
                } else {
                    itensPedido.push({
                        id: prato.id,
                        nome: prato.nome,
                        preco: Number(prato.preco),
                        quantidade: 1
                    });
                }

                adicionarAoPedidoAtualizar();
            }

            function alterarQuantidade(pratoId, valor) {
                const item = itensPedido.find(item => item.id === pratoId);

                if (!item) {
                    return;
                }

                item.quantidade += valor;

                if (item.quantidade <= 0) {
                    itensPedido = itensPedido.filter(item => item.id !== pratoId);
                }

                adicionarAoPedidoAtualizar();
            }


            function adicionarAoPedidoAtualizar() {
                const campoObservacao = document.getElementById("observacaoPedido");

                if (campoObservacao) {
                    observacaoPedido = campoObservacao.value;
                }
                const container = document.getElementById("pedido");

                const total = itensPedido.reduce(
                    (soma, item) => soma + (item.preco * item.quantidade),
                    0
                );

                container.innerHTML = `
                    <h2>🛒 Seu pedido</h2>

                    ${itensPedido.map(item => `
                        <div>
                            <strong>${item.nome}</strong>

                            <p>
                                <button onclick="alterarQuantidade(${item.id}, -1)">−</button>
                                Quantidade: ${item.quantidade}
                                <button onclick="alterarQuantidade(${item.id}, 1)">+</button>
                            </p>

                            <p>
                                R$ ${(item.preco * item.quantidade).toFixed(2).replace(".", ",")}
                            </p>
                        </div>
                    `).join("")}

                    <h3>
                        Total: R$ ${total.toFixed(2).replace(".", ",")}
                    </h3>

                    <h3>📝 Observação do pedido</h3>

                    <textarea
                        id="observacaoPedido"
                        placeholder="Ex.: pouco sal, sem cebola..."
                        rows="3"
                    >${observacaoPedido}</textarea>
                `;
            }


            async function carregarAvisos() {
                const parametros = new URLSearchParams(window.location.search);
                const restauranteId = parametros.get("restaurante");

                const resposta = await fetch(`/api/avisos?restaurante=${restauranteId}`);
                const dados = await resposta.json();

                const container = document.getElementById("avisos");

                container.innerHTML = dados.avisos.map(aviso => `
                    <div>
                        <h2>📢 ${aviso.titulo}</h2>
                        <p>${aviso.mensagem}</p>
                    </div>
                `).join("");
            }

            carregarCardapio();
            carregarAvisos();

            
        </script>

    </body>
</html>
