<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Gustum</title>

    <style>
        .card-produto {
    background: #1e293b;

    border: 1px solid #334155;

    border-radius: 16px;

    padding: 18px;

    cursor: pointer;

    width: 220px;

    color: #ffffff;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.35);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
}

.card-produto:hover {
    transform: translateY(-4px);

    border-color: #64748b;

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.45);
}

.card-produto h2 {
    margin: 0 0 10px;

    color: #ffffff;

    font-size: 20px;
}

.card-produto p {
    margin: 0 0 14px;

    color: #cbd5e1;

    line-height: 1.5;
}

.card-produto strong {
    display: block;

    font-size: 19px;

    color: #86efac;
}

body {
    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #111827,
            #172033
        );

    color: #ffffff;

    font-family: Arial, sans-serif;
}

header {
    text-align: center;

    padding: 25px 20px;

    background: #111827;

    border-bottom: 1px solid #334155;

    position: relative;
}

header h1 {
    margin: 0;

    font-size: 32px;
}

header p {
    margin: 8px 0 0;

    color: #cbd5e1;
}

main {
    width: 92%;

    max-width: 1100px;

    margin: 30px auto;
}


        .card-produto h2 {
            margin: 0 0 8px;
        }

        .card-produto p {
            margin: 0 0 10px;
        }

        .card-produto strong {
            display: block;
            font-size: 18px;
        }

        #pratos {
            width: 100%;
        }

        .grade-produtos {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
        }

        .modal-produto {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .conteudo-modal-produto {
    background: #1e293b;

    color: #ffffff;

    width: 90%;

    max-width: 500px;

    max-height: 90vh;

    overflow-y: auto;

    border-radius: 18px;

    padding: 24px;

    position: relative;

    border: 1px solid #334155;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.6);

    box-sizing: border-box;
}

.conteudo-modal-produto h2 {
    color: #ffffff;

    margin-top: 0;

    font-size: 25px;
}

.conteudo-modal-produto h3 {
    color: #e2e8f0;

    margin-top: 20px;
}

.conteudo-modal-produto p {
    color: #cbd5e1;

    line-height: 1.5;
}


.conteudo-modal-produto > button {
    color: #ffffff;

    background: #334155;

    width: 36px;
    height: 36px;

    border-radius: 50%;

    top: 12px;
    right: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.conteudo-modal-produto > button:hover {
    background: #475569;

    transform: rotate(90deg);
}

        .conteudo-modal-produto > button {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
        }

#botaoCarrinho {
    position: absolute;

    right: 25px;
    top: 25px;

    background: #16a34a;

    color: #ffffff;

    border: none;

    border-radius: 12px;

    padding: 12px 18px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 18px rgba(22, 163, 74, 0.35);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

#botaoCarrinho:hover {
    background: #22c55e;

    transform: translateY(-2px);
}

#quantidadeCarrinho {
    display: inline-flex;

    min-width: 24px;
    height: 24px;

    align-items: center;
    justify-content: center;

    margin-left: 5px;

    background: #ffffff;

    color: #166534;

    border-radius: 50%;

    font-size: 14px;
}


.titulo-categoria {
    width: 100%;

    margin: 30px 0 18px;

    padding: 12px 16px;

    box-sizing: border-box;

    background: #1e293b;

    border-left: 5px solid #22c55e;

    border-radius: 10px;

    color: #ffffff;

    font-size: 24px;

    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.25);
}


.conteudo-modal-produto button:not(:first-child) {
    cursor: pointer;
}

.conteudo-modal-produto #quantidadeProduto,
.conteudo-modal-produto #quantidadePorcao {
    display: inline-flex;

    min-width: 45px;

    height: 42px;

    align-items: center;
    justify-content: center;

    margin: 0 10px;

    background: #0f172a;

    border: 1px solid #475569;

    border-radius: 10px;

    color: #ffffff;

    font-size: 18px;

    font-weight: bold;
}


.controle-quantidade {
    display: flex;

    align-items: center;
    justify-content: center;

    margin: 15px 0;
}

.botao-quantidade {
    width: 44px;
    height: 44px;

    border: none;

    border-radius: 10px;

    background: #334155;

    color: #ffffff;

    font-size: 24px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.15s ease;
}

.botao-quantidade:hover {
    background: #475569;

    transform: scale(1.05);
}

.botao-quantidade:active {
    transform: scale(0.95);
}


.conteudo-modal-produto .botao-adicionar-carrinho {
    width: 100%;

    margin-top: 20px;

    padding: 15px 20px;

    border: none;

    border-radius: 12px;

    background: #16a34a;

    color: #ffffff;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 18px rgba(22, 163, 74, 0.35);

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.conteudo-modal-produto .botao-adicionar-carrinho:hover {
    background: #22c55e;

    transform: translateY(-2px);
}


#avisos {
    margin-bottom: 25px;
}

#avisos > div {
    background: #1e293b;

    border: 1px solid #475569;

    border-left: 5px solid #f59e0b;

    border-radius: 14px;

    padding: 16px 18px;

    margin-bottom: 14px;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.3);
}

#avisos h2 {
    margin: 0 0 8px;

    color: #fbbf24;

    font-size: 20px;
}

#avisos p {
    margin: 0;

    color: #e2e8f0;

    line-height: 1.5;
}


#quantidadeCarrinho {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 24px;
    height: 24px;

    margin-left: 6px;

    padding: 0 5px;

    box-sizing: border-box;

    background: #ffffff;

    color: #166534;

    border-radius: 50%;

    font-size: 14px;

    font-weight: bold;
}


#botaoCarrinho:hover {
    background: #22c55e;

    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 8px 22px rgba(22, 163, 74, 0.45);
}


.conteudo-modal-produto label {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px 14px;

    margin: 8px 0;

    background: #0f172a;

    border: 1px solid #334155;

    border-radius: 10px;

    color: #e2e8f0;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease;
}

.conteudo-modal-produto label:hover {
    background: #1e293b;

    border-color: #64748b;
}

.conteudo-modal-produto label input {
    width: 18px;

    height: 18px;

    accent-color: #22c55e;
}


.total-produto {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin: 22px 0 10px;

    padding: 15px 18px;

    background: #0f172a;

    border: 1px solid #334155;

    border-radius: 12px;
}

.total-produto span:first-child {
    color: #cbd5e1;

    font-size: 17px;

    font-weight: bold;
}

.total-produto strong {
    color: #86efac;

    font-size: 23px;
}




@media (max-width: 600px) {

    header {
        padding: 20px 15px 25px;
    }

    header h1 {
        font-size: 28px;
    }

    header p {
        font-size: 15px;
    }

    #botaoCarrinho {
        right: 12px;
        top: 18px;

        padding: 10px 13px;

        font-size: 16px;
    }

    main {
        width: 94%;

        margin: 20px auto;
    }

    .grade-produtos {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 12px;
    }

    .card-produto {
        width: auto;

        padding: 15px;

        box-sizing: border-box;
    }

    .card-produto h2 {
        font-size: 18px;
    }

    .card-produto p {
        font-size: 14px;
    }

    .card-produto strong {
        font-size: 17px;
    }

    .titulo-categoria {
        font-size: 21px;

        margin-top: 25px;
    }

    .conteudo-modal-produto {
        width: 94%;

        padding: 20px;

        border-radius: 16px;
    }

}


@media (max-width: 400px) {

    header {
        padding-top: 70px;
    }

    #botaoCarrinho {
        top: 15px;
        right: 15px;
    }

}


#acompanhamentoPedido {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 2000;
}

.status-pedido {
    background: white;
    color: #222;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    font-weight: bold;
    max-width: 280px;
}


.foto-produto-cardapio {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    margin-bottom: 12px;
}

.foto-produto-detalhe {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 14px;
    display: block;
    margin-bottom: 15px;
}


.mensagem-nao-trabalhamos {
    background: #1e293b;
    color: #ffffff;

    border: 1px solid #334155;
    border-radius: 16px;

    padding: 30px;
    margin: 30px auto;

    max-width: 600px;

    text-align: center;

    font-size: 22px;
    font-weight: bold;

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.35);
}

    </style>

</head>
    <body>

    <header>
        <h1>🍽️ Gustum</h1>
        <p>Cardápio de hoje</p>
        <button id="botaoCarrinho" onclick="abrirCarrinho()">
            🛒 <span id="quantidadeCarrinho">0</span>
        </button>
    </header>

    <main id="cardapio">

        <div id="avisos"></div>

        <div id="acompanhamentoPedido"></div>

        <div id="pratos"></div>

        <div id="pedido"></div>

    </main>

        <div id="modalProduto" class="modal-produto">
            <div class="conteudo-modal-produto">

                <button onclick="fecharProduto()">✕</button>

                <div id="detalhesProduto"></div>

            </div>
        </div>


        <script>
            let itensPedido = [];
            let pratosDisponiveis = [];
            let cardapioDiaSelecionado = null;
            let produtoSelecionadoId = null;
            let tamanhoEscolhidoAtual = null;
            let carrinho = [];
            const carrinhoSalvo = localStorage.getItem("carrinho");

            if (carrinhoSalvo) {
                carrinho = JSON.parse(carrinhoSalvo);
            }

            let observacaoPedido = "";
            const itensSalvos = localStorage.getItem("itensPedido");
            const observacaoSalva = localStorage.getItem("observacaoPedido");

            if (itensSalvos) {
                itensPedido = JSON.parse(itensSalvos);
            }

            if (observacaoSalva) {
                observacaoPedido = observacaoSalva;
            }

            

async function carregarCardapio() {
    const parametros = new URLSearchParams(window.location.search);
    const restauranteId = parametros.get("restaurante");

    const resposta = await fetch(`/api/cardapio?restaurante=${restauranteId}`);
    const dados = await resposta.json();
    pratosDisponiveis = dados.pratos;
    const cardapioDia = dados.cardapio_dia;
    cardapioDiaSelecionado = cardapioDia;
    const diaNaoTrabalhamos = dados.dia_nao_trabalhamos;
    const container = document.getElementById("pratos");

    if (diaNaoTrabalhamos) {

        container.innerHTML = `
            <div class="mensagem-nao-trabalhamos">
                🔴 Hoje não trabalhamos.
            </div>
        `;

        return;
    }

    const pratos = dados.pratos.filter(prato =>
        prato.categoria === "prato"
    );

    const porcoes = dados.pratos.filter(prato =>
        prato.categoria === "porcao"
    );

    const bebidas = dados.pratos.filter(prato =>
        prato.categoria === "bebida"
    );

    let htmlCardapioDia = "";

if (cardapioDia) {

    htmlCardapioDia = `
        <section class="secao-cardapio-dia">

            <h2 class="titulo-categoria">
                📅 Cardápio de hoje
            </h2>

            <div class="grade-produtos">

                <div
                    class="card-produto"
                    onclick="abrirCardapioDia('pequena')"
                >

                    ${
                        cardapioDia.foto_base64
                            ? `
                                <img
                                    src="${cardapioDia.foto_base64}"
                                    class="foto-produto-cardapio"
                                    alt="${cardapioDia.titulo}"
                                >
                            `
                            : ""
                    }

                    <h2>
                        ${cardapioDia.titulo} Pequena
                    </h2>

                    <p>
                        ${cardapioDia.descricao || ""}
                    </p>

                    <strong>
                        R$
                        ${Number(cardapioDia.preco_pequena)
                            .toFixed(2)
                            .replace(".", ",")}
                    </strong>

                </div>


                <div
                    class="card-produto"
                    onclick="abrirCardapioDia('media')"
                >

                    ${
                        cardapioDia.foto_base64
                            ? `
                                <img
                                    src="${cardapioDia.foto_base64}"
                                    class="foto-produto-cardapio"
                                    alt="${cardapioDia.titulo}"
                                >
                            `
                            : ""
                    }

                    <h2>
                        ${cardapioDia.titulo} Média
                    </h2>

                    <p>
                        ${cardapioDia.descricao || ""}
                    </p>

                    <strong>
                        R$
                        ${Number(cardapioDia.preco_media)
                            .toFixed(2)
                            .replace(".", ",")}
                    </strong>

                </div>


                <div
                    class="card-produto"
                    onclick="abrirCardapioDia('grande')"
                >

                    ${
                        cardapioDia.foto_base64
                            ? `
                                <img
                                    src="${cardapioDia.foto_base64}"
                                    class="foto-produto-cardapio"
                                    alt="${cardapioDia.titulo}"
                                >
                            `
                            : ""
                    }

                    <h2>
                        ${cardapioDia.titulo} Grande
                    </h2>

                    <p>
                        ${cardapioDia.descricao || ""}
                    </p>

                    <strong>
                        R$
                        ${Number(cardapioDia.preco_grande)
                            .toFixed(2)
                            .replace(".", ",")}
                    </strong>

                </div>

            </div>

        </section>
    `;
}

    container.innerHTML = `

    ${htmlCardapioDia}

        ${
            pratos.length > 0
                ? `
                    <h2 class="titulo-categoria">
                        🍽️ Pratos
                    </h2>

                    <div class="grade-produtos">

                        ${
                            pratos.map(prato => {

                                let cardsPrato = "";

                                if (prato.preco_pequena) {
                                    cardsPrato += `
                                        <div
                                            class="card-produto"
                                            onclick="abrirProduto(${prato.id}, 'pequena')"
                                        >
                                            ${prato.foto_base64
                                                ? '<img src="' + prato.foto_base64 + '" class="foto-produto-cardapio" alt="' + prato.nome + '">'
                                                : ""
                                            }

                                            <h2>${prato.nome} Pequena</h2>

                                            <p>${prato.descricao || ""}</p>

                                            <strong>
                                                R$ ${Number(prato.preco_pequena)
                                                    .toFixed(2)
                                                    .replace(".", ",")}
                                            </strong>
                                        </div>
                                    `;
                                }

                                if (prato.preco_media) {
                                    cardsPrato += `
                                        <div
                                            class="card-produto"
                                            onclick="abrirProduto(${prato.id}, 'media')"
                                        >
                                            ${prato.foto_base64
                                                ? '<img src="' + prato.foto_base64 + '" class="foto-produto-cardapio" alt="' + prato.nome + '">'
                                                : ""
                                            }

                                            <h2>${prato.nome} Média</h2>

                                            <p>${prato.descricao || ""}</p>

                                            <strong>
                                                R$ ${Number(prato.preco_media)
                                                    .toFixed(2)
                                                    .replace(".", ",")}
                                            </strong>
                                        </div>
                                    `;
                                }

                                if (prato.preco_grande) {
                                    cardsPrato += `
                                        <div
                                            class="card-produto"
                                            onclick="abrirProduto(${prato.id}, 'grande')"
                                        >
                                            ${prato.foto_base64
                                                ? '<img src="' + prato.foto_base64 + '" class="foto-produto-cardapio" alt="' + prato.nome + '">'
                                                : ""
                                            }

                                            <h2>${prato.nome} Grande</h2>

                                            <p>${prato.descricao || ""}</p>

                                            <strong>
                                                R$ ${Number(prato.preco_grande)
                                                    .toFixed(2)
                                                    .replace(".", ",")}
                                            </strong>
                                        </div>
                                    `;
                                }

                                return cardsPrato;

                            }).join("")
                        }

                    </div>
                `
                : ""
        }


        ${
            porcoes.length > 0
                ? `
                    <h2 class="titulo-categoria">
                        🥩 Porções
                    </h2>

                    <div class="grade-produtos">

                        ${
                            porcoes.map(porcao => `
                                <div
                                    class="card-produto"
                                    onclick="abrirProduto(${porcao.id}, 'porcao')"
                                >

                                    ${
                                        porcao.foto_base64
                                            ? `
                                                <img
                                                    src="${porcao.foto_base64}"
                                                    class="foto-produto-cardapio"
                                                    alt="${porcao.nome}"
                                                >
                                            `
                                            : ""
                                    }

                                    <h2>
                                        ${porcao.nome}
                                    </h2>

                                    <p>
                                        ${porcao.descricao || ""}
                                    </p>

                                    <strong>
                                        R$
                                        ${Number(porcao.preco_kg)
                                            .toFixed(2)
                                            .replace(".", ",")}
                                        / kg
                                    </strong>

                                </div>
                            `).join("")
                        }

                    </div>
                `
                : ""
        }


        ${
            bebidas.length > 0
                ? `
                    <h2 class="titulo-categoria">
                        🥤 Bebidas
                    </h2>

                    <div class="grade-produtos">

                        ${
                            bebidas.map(bebida => `
                                <div
                                    class="card-produto"
                                    onclick="abrirProduto(${bebida.id}, 'bebida')"
                                >

                                    ${
                                        bebida.foto_base64
                                            ? `
                                                <img
                                                    src="${bebida.foto_base64}"
                                                    class="foto-produto-cardapio"
                                                    alt="${bebida.nome}"
                                                >
                                            `
                                            : ""
                                    }

                                    <h2>
                                        ${bebida.nome}
                                    </h2>

                                    <p>
                                        ${bebida.descricao || ""}
                                    </p>

                                    <strong>
                                        R$
                                        ${Number(bebida.preco)
                                            .toFixed(2)
                                            .replace(".", ",")}
                                    </strong>

                                </div>
                            `).join("")
                        }

                    </div>
                `
                : ""
        }


    `;
}


function abrirProduto(id, tamanhoEscolhido = null) {
    const produto = pratosDisponiveis.find(p => p.id === id);

    if (!produto) {
        return;
    }
    produtoSelecionadoId = id;
    tamanhoEscolhidoAtual = tamanhoEscolhido;

    let precoSelecionado = Number(produto.preco);

    if (produto.categoria === "prato" && tamanhoEscolhido) {

        if (tamanhoEscolhido === "pequena") {
            precoSelecionado = Number(produto.preco_pequena);
        }

        if (tamanhoEscolhido === "media") {
            precoSelecionado = Number(produto.preco_media);
        }

        if (tamanhoEscolhido === "grande") {
            precoSelecionado = Number(produto.preco_grande);
        }
    }

    const detalhes = document.getElementById("detalhesProduto");

    if (produto.categoria === "prato" && tamanhoEscolhido) {

        detalhes.innerHTML = `
            ${
                produto.foto_base64
                    ? `<img
                        src="${produto.foto_base64}"
                        class="foto-produto-detalhe"
                        alt="${produto.nome}"
                    >`
                    : ""
            }

            <h2>${produto.nome}</h2>

            <p>${produto.descricao}</p>

            <h3>🥩 Escolha suas carnes</h3>

                <div class="opcoes-carne">

                    <label>
                        <input
                            type="radio"
                            name="opcaoCarne"
                            value="2_carne_1"
                        >
                        2 pedaços de ${produto.carne_1 || "Carne 1"}
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="opcaoCarne"

                    gramas = 100;

                    gramas = 1000;

                    gramas >= 1000

                );

                const resposta = await fetch(`/api/avisos?restaurante=${restauranteId}`);

                    </div>
                `).join("");
            }


            async function atualizarAcompanhamentoPedido() {

                const pedidoId =
                    localStorage.getItem("pedidoAtual");

                const container =
                    document.getElementById("acompanhamentoPedido");

                container.innerHTML = `
                    <div class="status-pedido">
                        🛒 Seu pedido está sendo acompanhado...
                    </div>
                `;

                if (!pedidoId) {
                    container.innerHTML = "";
                    return;
                }

                try {

                    const resposta =
                        await fetch(`/api/pedidos/${pedidoId}/status`);

                    const dados =
                        await resposta.json();

                    if (!dados.sucesso) {
                        container.innerHTML = "";
                        return;
                    }

                    const pedido = dados.pedido;

                    let mensagem = "";

                    if (pedido.status === "aguardando") {

                        mensagem =
                            `📦 Pedido #${pedido.id}<br>` +
                            `🛒 Você está em ${pedido.posicao}º lugar na fila`;

                    } else if (pedido.status === "em_preparo") {

                        mensagem =
                            `📦 Pedido #${pedido.id}<br>` +
                            `👨‍🍳 Seu pedido está em preparo`;

                    } else if (pedido.status === "pronto") {

                        mensagem =
                            `📦 Pedido #${pedido.id}<br>` +
                            `✅ Seu pedido está pronto!`;

                    } else if (pedido.status === "saiu_entrega") {

                        mensagem =
                            `📦 Pedido #${pedido.id}<br>` +
                            `🛵 Seu pedido saiu para entrega`;

                    } else if (pedido.status === "finalizado") {

                        mensagem =
                            `📦 Pedido #${pedido.id}<br>` +
                            (
                                pedido.tipo_entrega === "entrega"
                                    ? "✅ Pedido entregue!"
                                    : "✅ Pedido finalizado!"
                            );
                    }

                    if (mensagem) {

                        container.innerHTML = `
                            <div class="status-pedido">
                                ${mensagem}
                            </div>
                        `;

                    }

                } catch (erro) {

                    console.error(
                        "Erro ao atualizar pedido:",
                        erro
                    );
                }
            }



            carregarCardapio();
            carregarAvisos();
            atualizarAcompanhamentoPedido();

            setInterval(
                atualizarAcompanhamentoPedido,
                5000
            );

                if (campoObservacao) {
                    observacaoPedido = campoObservacao.value.trim();
                }

                const total = itensPedido.reduce(
                    (soma, item) => soma + (item.preco * item.quantidade),
                    0
                );

                const pedidoFinal = {
                    restaurante_id: 1,
                    itens: itensPedido,
                    observacao: observacaoPedido,
                    telefone: telefone,
                    tipo_entrega: tipoEntrega,
                    endereco: tipoEntrega === "entrega" ? endereco : null,
                    forma_pagamento: formaPagamento,
                    total: total
                };

                const resposta = await fetch("/api/pedidos", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(pedidoFinal)
                });

                const dados = await resposta.json();

                console.log("RESPOSTA DO PEDIDO:", dados);

                if (dados.sucesso) {
                    alert(
                        `✅ Pedido #${dados.pedido.id} enviado com sucesso!\n\n` +
                        `O restaurante recebeu seu pedido.`
                    );

                    limparCarrinho();
                }
            }

            function atualizarIconeCarrinho() {
                const quantidade = carrinho.reduce(
                    (total, item) => total + item.quantidade,
                    0
                );

                document.getElementById("quantidadeCarrinho").textContent = quantidade;
            }

            carregarCardapio();
        </script>


    </body>
</html>
